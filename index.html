<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyDoc — Document Generator</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --navy:           #0f172a;
            --navy-mid:       #1e293b;
            --navy-light:     #334155;
            --accent:         #3b82f6;
            --accent-dark:    #2563eb;
            --accent-soft:    #eff6ff;
            --success:        #10b981;
            --danger:         #ef4444;
            --warning:        #f59e0b;
            --text-primary:   #0f172a;
            --text-secondary: #64748b;
            --text-muted:     #94a3b8;
            --border:         #e2e8f0;
            --border-focus:   #3b82f6;
            --bg-page:        #f8fafc;
            --bg-card:        #ffffff;
            --bg-input:       #f8fafc;
            --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md:  0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg:  0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
            --radius-sm:  6px;
            --radius-md:  10px;
            --radius-lg:  16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* =====================================================
           APP HEADER
        ===================================================== */
        .app-header {
            background: var(--navy);
            border-bottom: 1px solid var(--navy-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-logo { display: flex; align-items: center; gap: 10px; }

        .app-logo .logo-mark {
            width: 30px; height: 30px;
            background: var(--accent);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; color: white;
            letter-spacing: -0.5px; flex-shrink: 0;
        }

        .app-logo .logo-text {
            font-size: 17px; font-weight: 700;
            color: white; letter-spacing: -0.3px;
        }

        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            color: rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
        }

        .btn-back:hover {
            color: white; background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.22);
        }

        /* =====================================================
           HOME SCREEN
        ===================================================== */
        .home-wrapper { max-width: 1100px; margin: 0 auto; padding: 60px 24px 80px; }
        .home-heading { text-align: center; margin-bottom: 48px; }

        .home-heading h2 {
            font-size: 32px; font-weight: 700; letter-spacing: -0.6px;
            color: var(--text-primary); margin-bottom: 10px;
        }

        .home-heading p { font-size: 16px; color: var(--text-secondary); margin: 0; }

        .home-section-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

        .home-section-heading h3 {
            font-size: 13px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-muted); margin: 0; white-space: nowrap;
        }

        .home-section-heading .section-rule { flex: 1; height: 1px; background: var(--border); }
        .home-divider { border: none; border-top: 1px solid var(--border); margin: 48px 0; }

        .search-bar-wrapper { position: relative; margin-bottom: 28px; }

        .search-bar-wrapper .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px; pointer-events: none;
        }

        .search-bar-input {
            width: 100%; padding: 10px 14px 10px 40px;
            font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-primary);
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: var(--radius-md); outline: none;
            transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow-sm);
        }

        .search-bar-input:focus {
            border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .search-bar-input::placeholder { color: var(--text-muted); }

        .all-docs-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 20px;
        }

        .all-docs-count {
            font-size: 12px; font-weight: 500;
            color: var(--text-muted); font-family: 'DM Mono', monospace;
        }

        .no-results { text-align: center; padding: 52px 20px; color: var(--text-muted); }
        .no-results .no-results-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; display: block; }
        .no-results p { font-size: 14px; margin: 0; }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .template-card {
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: var(--radius-lg); padding: 28px 24px;
            cursor: pointer; text-align: left; width: 100%;
            font-family: 'DM Sans', sans-serif; transition: var(--transition);
            box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
        }

        .template-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .template-card:hover {
            border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-3px);
        }

        .template-card:hover::before { transform: scaleX(1); }
        .template-card .card-icon { font-size: 30px; margin-bottom: 16px; display: block; }

        .template-card .card-category {
            font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
        }

        .template-card .card-name {
            font-size: 18px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 6px; letter-spacing: -0.2px;
        }

        .template-card .card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        /* =====================================================
           EDITOR LAYOUT
        ===================================================== */
        .editor-wrapper { max-width: 1200px; margin: 0 auto; padding: 32px 24px 60px; }

        .editor-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 28px; align-items: start;
        }

        @media (max-width: 900px) { .editor-grid { grid-template-columns: 1fr; } }

        /* =====================================================
           FORM PANEL
        ===================================================== */
        .form-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden;
        }

        .form-panel-header {
            padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }

        .form-panel-header .panel-icon { font-size: 22px; }

        .form-panel-header .panel-title {
            font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
            color: var(--text-primary); margin: 0;
        }

        .form-panel-body { padding: 24px; max-height: calc(100vh - 200px); overflow-y: auto; }
        .form-panel-body::-webkit-scrollbar { width: 4px; }
        .form-panel-body::-webkit-scrollbar-track { background: transparent; }
        .form-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .section-block { margin-bottom: 28px; }

        .section-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .repeatable-block {
            border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 16px; margin-bottom: 10px; background: var(--bg-input);
        }

        .repeatable-block-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 12px;
        }

        .repeatable-block-index {
            font-size: 11px; font-weight: 600;
            color: var(--text-muted); font-family: 'DM Mono', monospace;
        }

        .field-group { margin-bottom: 14px; }
        .field-group:last-child { margin-bottom: 0; }

        .field-label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 5px; letter-spacing: 0.1px;
        }

        .field-label .optional-badge {
            font-size: 10px; font-weight: 400;
            color: var(--text-muted); margin-left: 5px; font-style: italic;
        }

        .field-input {
            width: 100%; padding: 9px 12px;
            font-family: 'DM Sans', sans-serif; font-size: 13.5px;
            color: var(--text-primary); background: white;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
            appearance: none; -webkit-appearance: none;
        }

        .field-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .field-input::placeholder { color: var(--text-muted); }
        textarea.field-input { resize: vertical; min-height: 80px; line-height: 1.5; }

        /* =====================================================
           VALIDATION STATES
        ===================================================== */
        .field-input.is-valid { border-color: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.10); }
        .field-input.is-valid:focus { border-color: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
        .field-input.is-invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.10); }
        .field-input.is-invalid:focus { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }

        .field-error {
            display: flex; align-items: center; gap: 5px; margin-top: 5px;
            font-size: 11.5px; font-weight: 500; color: var(--danger); line-height: 1.4;
        }

        .field-error .error-icon { font-size: 12px; flex-shrink: 0; }

        .field-counter {
            display: flex; justify-content: flex-end; margin-top: 4px;
            font-size: 11px; font-family: 'DM Mono', monospace;
            color: var(--text-muted); transition: color 0.15s;
        }

        .field-counter.counter-warn { color: var(--warning); }
        .field-counter.counter-over { color: var(--danger); font-weight: 600; }

        /* =====================================================
           DATE FIELD — universal calendar picker
        ===================================================== */
        .date-field-wrapper { position: relative; display: flex; align-items: center; }

        .date-field-wrapper .field-input {
            flex: 1;
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
            border-right: none;
        }

        .date-field-wrapper .field-input:focus { z-index: 1; }

        .date-calendar-btn {
            display: flex; align-items: center; justify-content: center;
            width: 38px; min-height: 38px; background: var(--bg-input);
            border: 1px solid var(--border); border-left: none;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            cursor: pointer; font-size: 15px; transition: var(--transition); flex-shrink: 0;
        }

        .date-calendar-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

        .date-field-wrapper.date-valid .field-input { border-color: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.10); }
        .date-field-wrapper.date-valid .date-calendar-btn { border-color: var(--success); }
        .date-field-wrapper.date-invalid .field-input { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.10); }
        .date-field-wrapper.date-invalid .date-calendar-btn { border-color: var(--danger); }

        .date-native-picker {
            position: absolute; right: 0; top: 100%;
            width: 0; height: 0; opacity: 0; pointer-events: none; border: none; padding: 0;
        }

        /* =====================================================
           DATE RANGE FIELD
        ===================================================== */
        .daterange-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .daterange-row { display: flex; align-items: center; gap: 8px; }
        .daterange-row .date-field-wrapper { flex: 1; min-width: 0; }

        .daterange-separator {
            font-size: 12px; color: var(--text-muted);
            font-weight: 500; flex-shrink: 0; padding: 0 2px;
        }

        .btn-present {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 7px 11px;
            font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600;
            letter-spacing: 0.2px; color: var(--text-secondary);
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
            white-space: nowrap; flex-shrink: 0;
        }

        .btn-present:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .btn-present.is-active { color: white; background: var(--accent); border-color: var(--accent-dark); }
        .btn-present.is-active:hover { background: var(--accent-dark); }

        /* =====================================================
           IMAGE UPLOAD ZONE
        ===================================================== */
        .image-upload-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }

        .image-upload-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .image-upload-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .image-upload-zone { display: flex; align-items: center; gap: 16px; }

        .image-upload-trigger {
            position: relative; width: 80px; height: 80px; flex-shrink: 0;
            border-radius: 50%; overflow: hidden; cursor: pointer;
            border: 2px dashed var(--border); background: var(--bg-input);
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
            /* Image background properties — natural size, centred, no scaling */
            background-size: auto;
            background-position: center;
            background-repeat: no-repeat;
        }

        .image-upload-trigger.square { border-radius: var(--radius-md); }
        .image-upload-trigger:hover { border-color: var(--accent); }

        .image-upload-placeholder {
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; pointer-events: none; position: relative; z-index: 1;
        }

        .image-upload-placeholder .upload-icon { font-size: 22px; opacity: 0.4; }

        .image-upload-placeholder .upload-hint {
            font-size: 9px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted);
        }

        .image-upload-trigger .image-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.45);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 2px; opacity: 0; transition: opacity 0.2s;
            z-index: 2;
        }

        .image-upload-trigger:hover .image-overlay { opacity: 1; }
        .image-overlay .overlay-icon { font-size: 18px; }

        .image-overlay .overlay-text {
            font-size: 9px; font-weight: 600; color: white;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .image-upload-info { flex: 1; }
        .image-upload-info p { font-size: 12px; color: var(--text-secondary); margin: 0 0 8px 0; line-height: 1.5; }

        .btn-remove-image {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            color: var(--danger); background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }

        .btn-remove-image:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); }
        .image-file-input { display: none; }

        /* =====================================================
           BUTTONS
        ===================================================== */
        .btn-remove {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            color: var(--danger); background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }

        .btn-remove:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); }

        .btn-add {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            color: var(--accent); background: var(--accent-soft);
            border: 1.5px dashed rgba(59,130,246,0.35); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
            width: 100%; justify-content: center; margin-top: 4px;
        }

        .btn-add:hover { background: #dbeafe; border-color: var(--accent); }

        .form-panel-footer {
            padding: 16px 24px; border-top: 1px solid var(--border);
            background: var(--bg-input); display: flex; flex-direction: column; gap: 10px;
        }

        .footer-saveload-row { display: flex; gap: 8px; }

        .btn-secondary {
            flex: 1; display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 9px 14px; font-family: 'DM Sans', sans-serif;
            font-size: 13px; font-weight: 500; color: var(--text-secondary);
            background: white; border: 1px solid var(--border);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
        }

        .btn-secondary:hover { color: var(--text-primary); border-color: var(--navy-light); box-shadow: var(--shadow-sm); }

        .btn-download {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px 20px;
            font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
            color: white; background: var(--accent); border: none;
            border-radius: var(--radius-md); cursor: pointer;
            transition: var(--transition); letter-spacing: 0.1px;
        }

        .btn-download:hover { background: var(--accent-dark); box-shadow: 0 4px 14px rgba(59,130,246,0.4); transform: translateY(-1px); }
        .btn-download:active { transform: translateY(0); }
        .btn-download:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }

        /* =====================================================
           PREVIEW PANEL
        ===================================================== */
        .preview-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
            overflow: hidden; position: sticky; top: 78px;
        }

        .preview-panel-header {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .preview-panel-header .preview-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-muted);
        }

        .preview-live-dot {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 500; color: var(--success);
        }

        .preview-live-dot::before {
            content: ''; width: 6px; height: 6px; background: var(--success);
            border-radius: 50%; animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.85); }
        }

        .preview-scroll-area {
            max-height: calc(100vh - 250px); overflow-y: auto;
            overflow-x: hidden; background: #f1f5f9;
        }

        .preview-scroll-area::-webkit-scrollbar { width: 4px; }
        .preview-scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* =====================================================
           PREVIEW DOCUMENT — outer shell only
        ===================================================== */
        .preview-doc {
            background: white; margin: 20px; border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg); padding: 36px 36px 44px;
            min-height: 400px; font-size: 11.5px; line-height: 1.65;
            color: #1e293b; font-family: 'DM Sans', sans-serif;
        }

        /* =====================================================
           DESIGN SYSTEM — universal building blocks
           Change anything here → ALL templates update.
        ===================================================== */

        /* ── DocHeader ── */
        .ds-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--navy);
            margin-bottom: 18px;
        }

        .ds-header-text { flex: 1; min-width: 0; }

        .ds-header-title {
            font-size: 24px; font-weight: 700; letter-spacing: -0.5px;
            color: var(--navy); margin-bottom: 2px;
        }

        .ds-header-subtitle {
            font-size: 13px; color: var(--accent);
            font-weight: 500; margin-bottom: 6px;
        }

        .ds-header-meta {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 0;
            margin-top: 4px;
        }

        .ds-header-meta-item {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .ds-header-meta-item + .ds-header-meta-item::before {
            content: '·';
            margin: 0 7px;
            color: var(--text-muted);
            font-size: 10px;
        }

        .ds-header-meta-link { color: var(--accent); }

        /* ── Image containers — background approach.
           background-size: auto  → natural pixel dimensions, never scaled.
           background-position: center → centred inside the mask.
           overflow: hidden + border-radius → the mask that crops the excess.
           The image keeps its original proportions no matter its size. ── */

        .ds-header-image-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--border);
            background-color: var(--bg-input);
            background-size: auto;
            background-position: center;
            background-repeat: no-repeat;
        }

        .ds-header-image-square {
            width: 68px;
            height: 68px;
            border-radius: var(--radius-md);
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border);
            background-color: var(--bg-input);
            background-size: auto;
            background-position: center;
            background-repeat: no-repeat;
        }

        .ds-header-image-placeholder-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background-color: var(--bg-input);
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .ds-header-image-placeholder-square {
            width: 68px;
            height: 68px;
            border-radius: var(--radius-md);
            overflow: hidden;
            flex-shrink: 0;
            background-color: var(--bg-input);
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .ds-header-image-placeholder-circle .ph-icon,
        .ds-header-image-placeholder-square .ph-icon { font-size: 20px; opacity: 0.3; }

        .ds-header-image-placeholder-circle .ph-text,
        .ds-header-image-placeholder-square .ph-text {
            font-size: 8px; color: var(--text-muted); font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.4px;
        }

        .ds-header-right {
            display: flex; flex-direction: column;
            align-items: flex-end; gap: 8px; flex-shrink: 0;
        }

        .ds-header-right-title {
            font-size: 14px; font-weight: 700; color: var(--navy);
            letter-spacing: 0.5px; text-transform: uppercase;
        }

        .ds-header-right-meta {
            text-align: right; font-size: 11px;
            color: var(--text-secondary); line-height: 1.8;
        }

        .ds-header-right-meta strong {
            color: var(--text-primary); font-family: 'DM Mono', monospace;
        }

        /* ── DocSection ── */
        .ds-section { margin-top: 20px; }

        .ds-section-heading {
            font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: var(--accent);
            padding-bottom: 4px; border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }

        /* ── DocTwoColumn ── */
        .ds-two-column {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 16px; margin-bottom: 20px;
        }

        .ds-column-box {
            padding: 12px 14px; background: #f8fafc;
            border-radius: var(--radius-sm); border-left: 3px solid var(--accent);
        }

        .ds-column-label {
            font-size: 9px; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px;
        }

        .ds-column-name {
            font-size: 13px; font-weight: 600;
            color: var(--text-primary); margin-bottom: 3px;
        }

        .ds-column-detail {
            font-size: 11px; color: var(--text-secondary);
            white-space: pre-wrap; line-height: 1.5;
        }

        .ds-column-detail-link { color: var(--accent); }

        /* ── DocEntryList ── */
        .ds-entry { margin-bottom: 12px; }
        .ds-entry-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .ds-entry-meta { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
        .ds-entry-meta-primary { font-size: 12px; color: var(--text-secondary); }
        .ds-entry-meta-separator { color: #cbd5e1; font-size: 10px; }

        .ds-entry-meta-secondary {
            font-size: 11px; color: var(--text-muted);
            font-family: 'DM Mono', monospace;
        }

        .ds-entry-body {
            font-size: 11.5px; color: var(--text-secondary);
            margin-top: 4px; white-space: pre-wrap; line-height: 1.55;
        }

        /* ── DocTagList ── */
        .ds-tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

        .ds-tag {
            display: inline-block; padding: 3px 9px;
            font-size: 10.5px; font-weight: 500;
            color: var(--accent-dark); background: var(--accent-soft);
            border: 1px solid rgba(59,130,246,0.2); border-radius: 20px;
        }

        /* ── DocTable ── */
        .ds-table {
            width: 100%; border-collapse: collapse;
            margin-bottom: 16px; font-size: 11.5px;
        }

        .ds-table thead th {
            padding: 8px 10px; text-align: left;
            font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: white; background: var(--navy);
        }

        .ds-table thead th:last-child { text-align: right; }
        .ds-table tbody tr { border-bottom: 1px solid var(--border); }
        .ds-table tbody tr:last-child { border-bottom: none; }
        .ds-table tbody td { padding: 8px 10px; color: var(--text-primary); vertical-align: top; }
        .ds-table tbody td.ds-table-center { text-align: center; color: var(--text-secondary); }

        .ds-table tbody td.ds-table-mono {
            text-align: right; font-family: 'DM Mono', monospace; color: var(--text-secondary);
        }

        .ds-table tbody td.ds-table-total {
            text-align: right; font-family: 'DM Mono', monospace; color: var(--text-primary);
        }

        /* ── DocTotals ── */
        .ds-totals { margin-left: auto; width: 220px; }

        .ds-totals-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0; font-size: 11.5px; color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .ds-totals-row:last-child {
            border-bottom: none; font-size: 13.5px; font-weight: 700;
            color: var(--navy); margin-top: 4px; padding-top: 8px;
        }

        .ds-totals-value { font-family: 'DM Mono', monospace; }

        /* ── DocTextBlock ── */
        .ds-text-block {
            font-size: 11px; color: #475569;
            line-height: 1.65; white-space: pre-wrap; margin: 0;
        }

        /* ── DocNote ── */
        .ds-note {
            margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
            font-size: 11px; color: var(--text-muted); text-align: center;
        }

        /* =====================================================
           EMPTY STATE
        ===================================================== */
        .empty-preview { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .empty-preview .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
        .empty-preview p { font-size: 13px; margin: 0; }

        /* =====================================================
           TEMPLATE EXTRAS
        ===================================================== */
        .template-extras { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

        .tax-row { display: flex; align-items: center; gap: 10px; }

        .tax-row label {
            font-size: 12px; font-weight: 500; color: var(--text-secondary);
            white-space: nowrap; flex-shrink: 0;
        }

        .tax-row input {
            width: 80px; padding: 7px 10px; font-family: 'DM Mono', monospace;
            font-size: 13px; color: var(--text-primary); background: white;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }

        .tax-row input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
        .tax-row .tax-hint { font-size: 11px; color: var(--text-muted); }

        /* =====================================================
           PDF EXPORT OVERLAY
        ===================================================== */
        .pdf-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(15,23,42,0.72);
            display: flex; align-items: center; justify-content: center;
        }

        .pdf-overlay-card {
            background: white; border-radius: var(--radius-lg);
            padding: 36px 44px; text-align: center;
            box-shadow: var(--shadow-lg); min-width: 260px;
        }

        .pdf-overlay-spinner {
            width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.75s linear infinite; margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .pdf-overlay-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
        .pdf-overlay-sub { font-size: 12px; color: var(--text-muted); }

        /* =====================================================
           ANIMATIONS
        ===================================================== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .animate-in { animation: fadeInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) both; }
        .animate-in:nth-child(1) { animation-delay: 0ms; }
        .animate-in:nth-child(2) { animation-delay: 60ms; }
        .animate-in:nth-child(3) { animation-delay: 120ms; }
        .animate-in:nth-child(4) { animation-delay: 180ms; }

    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
const { jsPDF } = window.jspdf;

/* ============================================================
   UNIVERSAL VALIDATION ENGINE
============================================================ */

const MAX_TEXT   = 3000;
const MAX_NUMBER = 1000000000;

function validateTextLike(v, required) {
    if (!v || !v.trim()) return required ? "This field is required" : null;
    if (v.length > MAX_TEXT) return `Maximum ${MAX_TEXT.toLocaleString()} characters allowed`;
    return null;
}

const VALIDATORS = {
    text:     { validate: (v, required) => validateTextLike(v, required) },
    textarea: { validate: (v, required) => validateTextLike(v, required) },

    email: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
            return ok ? null : "Please enter a valid email address (e.g. name@domain.com)";
        }
    },

    phone: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const ok = /^[+\d][\d\s\-().]{3,24}$/.test(v.trim());
            return ok ? null : "Phone can only contain digits, spaces, +, -, ( )";
        }
    },

    number: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const n = parseFloat(String(v).replace(/,/g, ""));
            if (isNaN(n))       return "Please enter a valid number (e.g. 150.00)";
            if (n < 0)          return "Number cannot be negative";
            if (n > MAX_NUMBER) return "Number cannot exceed 1,000,000,000";
            return null;
        }
    },

    date: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const trimmed  = v.trim();
            const patterns = [
                /^\d{2}\/\d{2}\/\d{4}$/,
                /^\d{2}-\d{2}-\d{4}$/,
                /^\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}$/
            ];
            if (!patterns.some(p => p.test(trimmed)))
                return "Use DD/MM/YYYY, DD-MM-YYYY or e.g. 23 Feb 2026";
            return null;
        }
    },

    year: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const trimmed = v.trim();
            if (!/^\d{4}$/.test(trimmed)) return "Please enter a 4-digit year (e.g. 2019)";
            const n = parseInt(trimmed, 10);
            if (n < 1900 || n > 2100) return "Year must be between 1900 and 2100";
            return null;
        }
    },

    url: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const ok = /^(https?:\/\/)?(www\.)?[\w\-]+(\.[\w\-]+)+(\/[\w\-._~:/?#[\]@!$&'()*+,;=%]*)?$/.test(v.trim());
            return ok ? null : "Please enter a valid URL (e.g. www.behance.net/yourname)";
        }
    },

    address: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const trimmed = v.trim();
            if (trimmed.length < 5)   return "Address is too short — include street name and number";
            if (trimmed.length > 200) return "Address cannot exceed 200 characters";
            if (!/[a-zA-Z]/.test(trimmed) || !/\d/.test(trimmed))
                return "Address must include a street name and number (e.g. 12 Oak Street)";
            return null;
        }
    },

    skill: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            if (v.length > 60) return "Skill name cannot exceed 60 characters";
            return null;
        }
    },

    daterange: {
        validate: (v, required) => {
            if (!v || typeof v !== "object") return required ? "This field is required" : null;
            const { start, end, present } = v;
            if (!start || !start.trim()) return required ? "Start date is required" : null;
            const patterns = [
                /^\d{2}\/\d{2}\/\d{4}$/,
                /^\d{2}-\d{2}-\d{4}$/,
                /^\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}$/
            ];
            if (!patterns.some(p => p.test(start.trim())))
                return "Start date: use DD/MM/YYYY or e.g. 01 Jan 2022";
            if (present) return null;
            if (!end || !end.trim()) return "End date is required, or toggle Present";
            if (!patterns.some(p => p.test(end.trim())))
                return "End date: use DD/MM/YYYY or e.g. 01 Mar 2025";
            const startDate = parseDisplayDate(start);
            const endDate   = parseDisplayDate(end);
            if (startDate && endDate && endDate <= startDate)
                return "End date must be after the start date";
            return null;
        }
    }
};

function validateField(field, value) {
    const key       = field.validate || field.type || "text";
    const validator = VALIDATORS[key];
    if (!validator) return null;
    return validator.validate(value, !field.optional);
}

function nativeDateToDisplay(nativeVal) {
    if (!nativeVal) return "";
    const [y, m, d] = nativeVal.split("-");
    return `${d}/${m}/${y}`;
}

/* ============================================================
   UNIVERSAL CROSS-FIELD VALIDATION
============================================================ */

function parseDisplayDate(str) {
    if (!str || !str.trim()) return null;
    const s = str.trim();
    const dmy = s.match(/^(\d{1,2})[\/\-](\d{2})[\/\-](\d{4})$/);
    if (dmy) return new Date(+dmy[3], +dmy[2] - 1, +dmy[1]);
    const months = {
        jan:0, feb:1, mar:2, apr:3, may:4,  jun:5,
        jul:6, aug:7, sep:8, oct:9, nov:10, dec:11
    };
    const named = s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})$/);
    if (named) {
        const m = months[named[2].toLowerCase().slice(0, 3)];
        if (m !== undefined) return new Date(+named[3], m, +named[1]);
    }
    return null;
}

function validateCrossFields(section, block) {
    const errors = [];
    section.fields.forEach(field => {
        if (!field.afterField) return;
        const thisVal  = block[field.name]      || "";
        const otherVal = block[field.afterField] || "";
        if (!thisVal || !thisVal.trim || !thisVal.trim()) return;
        if (!otherVal || !otherVal.trim()) return;
        const thisDate  = parseDisplayDate(thisVal);
        const otherDate = parseDisplayDate(otherVal);
        if (!thisDate || !otherDate) return;
        if (thisDate <= otherDate) {
            const otherField = section.fields.find(f => f.name === field.afterField);
            const otherLabel = otherField ? otherField.label : field.afterField;
            errors.push({ fieldName: field.name, error: `Must be after the ${otherLabel}` });
        }
    });
    return errors;
}

function getAllFieldErrors(template, documentData) {
    const errors = [];
    template.sections.forEach(section => {
        const blocks = Array.isArray(documentData[section.id])
            ? documentData[section.id]
            : [documentData[section.id]];
        blocks.forEach((block, idx) => {
            section.fields.forEach(field => {
                const val = block[field.name] !== undefined ? block[field.name] : "";
                const err = validateField(field, val);
                if (err) errors.push({ sectionId: section.id, blockIndex: idx, fieldName: field.name });
            });
            validateCrossFields(section, block).forEach(({ fieldName }) => {
                errors.push({ sectionId: section.id, blockIndex: idx, fieldName });
            });
        });
    });
    return errors;
}

/* ============================================================
   DATE RANGE DISPLAY HELPER
============================================================ */

function formatDateRange(v) {
    if (!v || typeof v !== "object") return "";
    const { start, end, present } = v;
    if (!start) return "";
    if (present) return `${start} – Present`;
    if (end) return `${start} – ${end}`;
    return start;
}

/* ============================================================
   DESIGN SYSTEM — UNIVERSAL BUILDING BLOCKS
   Change any component here → every template updates instantly.
   Templates never set their own styles — only compose these.
============================================================ */

/* ── DocHeader ── */
function DocHeader({ title, subtitle, metaItems, rightPanel, image }) {
    const hasLeft  = title || subtitle || (metaItems && metaItems.length > 0);
    const hasRight = rightPanel || image;

    return (
        <div className="ds-header">
            {hasLeft && (
                <div className="ds-header-text">
                    {title    && <div className="ds-header-title">{title}</div>}
                    {subtitle && <div className="ds-header-subtitle">{subtitle}</div>}
                    {metaItems && metaItems.length > 0 && (
                        <div className="ds-header-meta">
                            {metaItems.map((item, i) => (
                                <span
                                    key={i}
                                    className={
                                        "ds-header-meta-item" +
                                        (item.isLink ? " ds-header-meta-link" : "")
                                    }
                                >
                                    {item.value}
                                </span>
                            ))}
                        </div>
                    )}
                </div>
            )}
            {hasRight && (
                <div className="ds-header-right">
                    {image && (
                        image.src ? (
                            /* Background approach: natural proportions, centred,
                               border-radius mask crops the excess — no scaling ever */
                            <div
                                className={
                                    image.shape === "square"
                                        ? "ds-header-image-square"
                                        : "ds-header-image-circle"
                                }
                                style={{
                                    backgroundImage:    `url(${image.src})`,
                                    backgroundSize:     "auto",
                                    backgroundPosition: "center",
                                    backgroundRepeat:   "no-repeat"
                                }}
                            />
                        ) : (
                            <div
                                className={
                                    image.shape === "square"
                                        ? "ds-header-image-placeholder-square"
                                        : "ds-header-image-placeholder-circle"
                                }
                            >
                                <span className="ph-icon">{image.icon}</span>
                                <span className="ph-text">{image.label}</span>
                            </div>
                        )
                    )}
                    {rightPanel && (
                        <div>
                            {rightPanel.title && (
                                <div className="ds-header-right-title">{rightPanel.title}</div>
                            )}
                            {rightPanel.rows && rightPanel.rows.length > 0 && (
                                <div className="ds-header-right-meta">
                                    {rightPanel.rows.map((row, i) => (
                                        <div key={i}>
                                            {row.label}: <strong>{row.value}</strong>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

/* ── DocSection ── */
function DocSection({ title, children }) {
    if (!children) return null;
    return (
        <div className="ds-section">
            <div className="ds-section-heading">{title}</div>
            {children}
        </div>
    );
}

/* ── DocTwoColumn ── */
function DocTwoColumn({ columns }) {
    if (!columns || columns.length === 0) return null;
    return (
        <div className="ds-two-column">
            {columns.map((col, i) => (
                <div key={i} className="ds-column-box">
                    {col.label && <div className="ds-column-label">{col.label}</div>}
                    {col.name  && <div className="ds-column-name">{col.name}</div>}
                    {col.lines && col.lines.map((line, j) => (
                        line.value ? (
                            <div
                                key={j}
                                className={
                                    "ds-column-detail" +
                                    (line.isLink ? " ds-column-detail-link" : "")
                                }
                            >
                                {line.value}
                            </div>
                        ) : null
                    ))}
                </div>
            ))}
        </div>
    );
}

/* ── DocEntryList ── */
function DocEntryList({ entries }) {
    if (!entries || entries.length === 0) return null;
    return (
        <div>
            {entries.map((entry, i) => (
                <div key={i} className="ds-entry">
                    {entry.title && (
                        <div className="ds-entry-title">{entry.title}</div>
                    )}
                    {(entry.primary || entry.secondary) && (
                        <div className="ds-entry-meta">
                            {entry.primary && (
                                <span className="ds-entry-meta-primary">{entry.primary}</span>
                            )}
                            {entry.primary && entry.secondary && (
                                <span className="ds-entry-meta-separator">·</span>
                            )}
                            {entry.secondary && (
                                <span className="ds-entry-meta-secondary">{entry.secondary}</span>
                            )}
                        </div>
                    )}
                    {entry.body && (
                        <div className="ds-entry-body">{entry.body}</div>
                    )}
                </div>
            ))}
        </div>
    );
}

/* ── DocTagList ── */
function DocTagList({ tags }) {
    if (!tags || tags.length === 0) return null;
    return (
        <div className="ds-tag-list">
            {tags.map((tag, i) => (
                <span key={i} className="ds-tag">{tag}</span>
            ))}
        </div>
    );
}

/* ── DocTable ── */
function DocTable({ columns, rows }) {
    if (!rows || rows.length === 0) return null;
    return (
        <table className="ds-table">
            <thead>
                <tr>
                    {columns.map((col, i) => (
                        <th key={i} style={{ width: col.width, textAlign: col.align || "left" }}>
                            {col.label}
                        </th>
                    ))}
                </tr>
            </thead>
            <tbody>
                {rows.map((row, i) => (
                    <tr key={i}>
                        {row.cells.map((cell, j) => (
                            <td
                                key={j}
                                className={
                                    cell.mono && cell.center ? "ds-table-center" :
                                    cell.mono               ? "ds-table-mono"   :
                                    cell.total              ? "ds-table-total"  : ""
                                }
                            >
                                {cell.value}
                            </td>
                        ))}
                    </tr>
                ))}
            </tbody>
        </table>
    );
}

/* ── DocTotals ── */
function DocTotals({ rows }) {
    if (!rows || rows.length === 0) return null;
    return (
        <div className="ds-totals">

                <div key={i} className="ds-totals-row">
                    <span>{row.label}</span>
                    <span className="ds-totals-value">{row.value}</span>
                </div>
            ))}

}

/* ── DocTextBlock ── */
function DocTextBlock({ text }) {

    return <p className="ds-text-block">{text}</p>;
}

/* ── DocNote ── */
function DocNote({ text }) {

/* ============================================================
   UNIVERSAL PREVIEW
   One component for every template ever made.
   Reads template.layoutFn, renders matching design system blocks.
============================================================ */

function UniversalPreview({ template, documentData, extrasState, uploadedImage, previewDocRef }) {
    if (!template) return null;

    const blocks = template.layoutFn
        ? template.layoutFn({ documentData, extrasState, uploadedImage })
        : [];

    const hasContent = blocks.some(b => b.hasContent !== false);

    if (!hasContent) {
        return (
            <div className="empty-preview" ref={previewDocRef}>
                <div className="empty-icon">{template.icon}</div>
                <p>Fill in the form to see your {template.name.toLowerCase()} preview</p>
            </div>
        );
    }

    return (
        <div className="preview-doc" ref={previewDocRef}>
            {blocks.map((block, i) => {
                if (block.hasContent === false) return null;

                switch (block.type) {

                    case "header":
                        return (
                            <DocHeader
                                key={i}
                                title={block.title}
                                subtitle={block.subtitle}
                                metaItems={block.metaItems}
                                rightPanel={block.rightPanel}
                                image={block.image}
                            />
                        );

                    case "twoColumn":
                        return <DocTwoColumn key={i} columns={block.columns} />;

                    case "entryList":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocEntryList entries={block.entries} />
                            </DocSection>
                        );

                    case "tagList":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocTagList tags={block.tags} />
                            </DocSection>
                        );

                    case "table":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocTable columns={block.columns} rows={block.rows} />
                            </DocSection>
                        );

                    case "totals":
                        return <DocTotals key={i} rows={block.rows} />;

                    case "textBlock":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocTextBlock text={block.text} />
                            </DocSection>
                        );

                    case "note":
                        return <DocNote key={i} text={block.text} />;

                    default:
                        return null;
                }
            })}
        </div>
    );
}

/* ============================================================
   INVOICE CALCULATION HELPERS
============================================================ */

function parseNumber(val) {
    const n = parseFloat(String(val).replace(/[^0-9.]/g, ""));
    return isNaN(n) ? 0 : n;
}

function calcInvoiceTotals(items, taxRate) {
    const subtotal  = items.reduce((s, r) => s + parseNumber(r.qty) * parseNumber(r.price), 0);
    const taxAmount = subtotal * (parseNumber(taxRate) / 100);
    return { subtotal, taxAmount, total: subtotal + taxAmount };
}

function formatMoney(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function initSection(section) {

            ? { start: "", end: "", present: false }

/* ============================================================
   IMAGE HELPERS
============================================================ */

function readImageAsBase64(file) {
    return new Promise((resolve, reject) => {
        const reader   = new FileReader();
        reader.onload  = e  => resolve(e.target.result);
        reader.onerror = () => reject(new Error("Could not read image"));
        reader.readAsDataURL(file);
    });
}

/* ============================================================
   PDF EXPORT — maximum quality
   scale: 3, PNG lossless, imageTimeout: 0, windowWidth: 1400
============================================================ */

async function exportPreviewToPDF(previewDocRef, filename) {
    const node = previewDocRef.current;
    if (!node) return;

    const prevShadow = node.style.boxShadow;
    const prevMargin = node.style.margin;
    const prevRadius = node.style.borderRadius;
    node.style.boxShadow    = "none";
    node.style.margin       = "0";
    node.style.borderRadius = "0";

    const canvas = await window.html2canvas(node, {
        scale:           3,
        useCORS:         true,
        allowTaint:      true,
        backgroundColor: "#ffffff",
        logging:         false,
        removeContainer: true,
        windowWidth:     1400,
        imageTimeout:    0
    });

    node.style.boxShadow    = prevShadow;
    node.style.margin       = prevMargin;
    node.style.borderRadius = prevRadius;

    const A4_W     = 210;
    const A4_H     = 297;
    const canvasW  = canvas.width;
    const canvasH  = canvas.height;
    const pxPerMm  = canvasW / A4_W;
    const pageH_px = A4_H * pxPerMm;
    const pages    = Math.ceil(canvasH / pageH_px);
    const pdf      = new jsPDF("p", "mm", "a4");

    for (let p = 0; p < pages; p++) {
        if (p > 0) pdf.addPage();
        const sliceY     = p * pageH_px;
        const sliceH     = Math.min(pageH_px, canvasH - sliceY);
        const pageCanvas = document.createElement("canvas");
        pageCanvas.width  = canvasW;
        pageCanvas.height = sliceH;
        const ctx         = pageCanvas.getContext("2d");
        ctx.drawImage(canvas, 0, sliceY, canvasW, sliceH, 0, 0, canvasW, sliceH);
        const imgData   = pageCanvas.toDataURL("image/png");
        const sliceH_mm = sliceH / pxPerMm;
        pdf.addImage(imgData, "PNG", 0, 0, A4_W, sliceH_mm);
    }

    pdf.save(filename);
}

/* ============================================================
   SAVE / LOAD
============================================================ */

function saveProgressToFile(template, documentData, extrasState, uploadedImage) {
    const payload = {
        easydocVersion: "2.0",
        templateId:     template.id,
        documentData,
        extrasState,
        uploadedImage:  uploadedImage || null
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = "easydoc-" + template.id + "-progress.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function loadProgressFromFile() {
    return new Promise((resolve, reject) => {
        const input    = document.createElement("input");
        input.type     = "file";
        input.accept   = ".json,application/json";
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) { reject(new Error("No file selected")); return; }
            const reader   = new FileReader();
            reader.onload  = evt => {
                try { resolve(JSON.parse(evt.target.result)); }
                catch { reject(new Error("Invalid file — could not read the saved progress.")); }
            };
            reader.onerror = () => reject(new Error("Could not read file."));
            reader.readAsText(file);
        };
        document.body.appendChild(input);
        input.click();
        document.body.removeChild(input);
    });
}

/* ============================================================
   UNIVERSAL IMAGE UPLOAD ZONE
   Uses background-image approach so the upload trigger preview
   matches exactly what the document preview shows — natural
   proportions, centred, cropped by the shape mask.
============================================================ */

function ImageUploadZone({ imageConfig, uploadedImage, onImageChange }) {
    const fileInputRef = useRef(null);
    if (!imageConfig) return null;
    const isCircle = imageConfig.shape === "circle";

    async function handleFileChange(e) {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        try {
            const base64 = await readImageAsBase64(file);
            onImageChange(base64);
        } catch { /* silently ignore */ }
        e.target.value = "";
    }

    function handleRemove(e) {
        e.stopPropagation();
        onImageChange(null);
    }

    /* When an image is uploaded, apply it as a background so the
       trigger preview uses the same natural-proportions approach */
    const triggerStyle = uploadedImage
        ? {
            backgroundImage:    `url(${uploadedImage})`,
            backgroundSize:     "auto",
            backgroundPosition: "center",
            backgroundRepeat:   "no-repeat"
          }
        : {};

    return (
        <div className="image-upload-section">
            <div className="image-upload-label">{imageConfig.label}</div>
            <div className="image-upload-zone">
                <div
                    className={isCircle ? "image-upload-trigger" : "image-upload-trigger square"}
                    style={triggerStyle}
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    title={uploadedImage ? "Click to change image" : "Click to upload image"}
                >
                    {uploadedImage ? (
                        /* Overlay only — no img tag, background handles the image */
                        <div className="image-overlay">
                            <span className="overlay-icon">✏️</span>
                            <span className="overlay-text">Change</span>
                        </div>
                    ) : (
                        <div className="image-upload-placeholder">
                            <span className="upload-icon">{imageConfig.icon}</span>
                            <span className="upload-hint">Upload</span>
                        </div>
                    )}
                </div>
                <div className="image-upload-info">
                    <p>Optional. Click to upload.<br />JPG, PNG or WebP. Max 5 MB.</p>
                    {uploadedImage && (
                        <button className="btn-remove-image" onClick={handleRemove}>
                            ✕ Remove
                        </button>
                    )}
                </div>
                <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                    className="image-file-input"
                    onChange={handleFileChange}
                />
            </div>
        </div>
    );
}

function DatePicker({ value, onChange, onBlur, placeholder, inputClass, fieldName }) {

            datePickerRef.current.showPicker

        <div className="date-field-wrapper">
            <input

                placeholder={placeholder || "DD/MM/YYYY"}
                value={value}
                onChange={e => onChange(e.target.value)}
                onBlur={onBlur}

            />
            <button
                type="button"
                className="date-calendar-btn"

                title="Open calendar"

                onChange={handleNativeChange}

            />
