function DatePicker({ value, onChange, onBlur, placeholder, inputClass, fieldName }) {
    const datePickerRef = useRef(null);

    function openCalendar() {
        if (datePickerRef.current) {
            datePickerRef.current.showPicker
                ? datePickerRef.current.showPicker()
                : datePickerRef.current.click();
        }
    }

    function handleNativeChange(e) {
        const [y, m, d] = e.target.value.split("-");
        onChange(`${d}/${m}/${y}`);
        if (onBlur) onBlur();
    }

    return (
        <div className="date-field-wrapper">
            <input
                className={inputClass || "field-input"}
                type="text"
                placeholder={placeholder || "DD/MM/YYYY"}
                value={value}
                onChange={e => onChange(e.target.value)}
                onBlur={onBlur}
                data-field-name={fieldName}
            />
            <button
                type="button"
                className="date-calendar-btn"
                onClick={openCalendar}
                title="Open calendar"
            >
                📅
            </button>
            <input
                ref={datePickerRef}
                type="date"
                className="date-native-picker"
                onChange={handleNativeChange}
                tabIndex="-1"
            />
        </div>
    );
}

/* ============================================================
   DATE RANGE FIELD COMPONENT
============================================================ */

function DateRangeField({ field, value, onChange, forceShowError }) {
    const { t }     = useLang();
    const [touched, setTouched] = useState(false);

    const safeValue = (value && typeof value === "object")
        ? value
        : { start: "", end: "", present: false };

    const { start, end, present } = safeValue;
    const shouldShowError = touched || forceShowError;
    const errorMsg        = shouldShowError
        ? validateFieldWithT(field, safeValue, t)
        : null;
    const isValid = shouldShowError && !errorMsg && start.length > 0;

    const startClass = ["field-input", isValid ? "is-valid" : "", errorMsg ? "is-invalid" : ""].filter(Boolean).join(" ");
    const endClass   = ["field-input", isValid ? "is-valid" : "", (errorMsg && !present) ? "is-invalid" : ""].filter(Boolean).join(" ");

    function updateStart(v) { onChange({ ...safeValue, start: v }); }
    function updateEnd(v)   { onChange({ ...safeValue, end: v });   }

    function togglePresent() {
        onChange({ ...safeValue, present: !present, end: present ? end : "" });
        setTouched(true);
    }

    function handleBlur() { setTouched(true); }

    return (
        <div className="daterange-wrapper" data-field-name={field.name}>
            <div className="daterange-row">
                <DatePicker
                    value={start}
                    onChange={updateStart}
                    onBlur={handleBlur}
                    placeholder="DD/MM/YYYY"
                    inputClass={startClass}
                    fieldName={field.name + "_start"}
                />
                <span className="daterange-separator">–</span>
                {present ? (
                    <button
                        type="button"
                        className="btn-present is-active"
                        onClick={togglePresent}
                    >
                        {t("ui.present")}
                    </button>
                ) : (
                    <>
                        <DatePicker
                            value={end}
                            onChange={updateEnd}
                            onBlur={handleBlur}
                            placeholder="DD/MM/YYYY"
                            inputClass={endClass}
                            fieldName={field.name + "_end"}
                        />
                        <button
                            type="button"
                            className="btn-present"
                            onClick={togglePresent}
                        >
                            {t("ui.present")}
                        </button>
                    </>
                )}
            </div>
            {errorMsg && (
                <div className="field-error">
                    <span className="error-icon">⚠</span>{errorMsg}
                </div>
            )}
        </div>
    );
}

/* ============================================================
   UNIVERSAL SMART FIELD COMPONENT
============================================================ */

function SmartField({ field, value, onChange, forceShowError, crossFieldError }) {
    const { t }     = useLang();
    const [touched, setTouched] = useState(false);

    const shouldShowError = touched || forceShowError;
    const isDateField     = field.validate === "date";
    const isDateRange     = field.validate === "daterange";
    const isNumberField   = field.validate === "number";
    const isTextarea      = field.type === "textarea";
    const showCounter     = isTextarea || field.validate === "textarea" || field.validate === "text";

    if (isDateRange) {
        return (
            <DateRangeField
                field={field}
                value={value}
                onChange={onChange}
                forceShowError={forceShowError}
            />
        );
    }

    const fieldError = shouldShowError ? validateFieldWithT(field, value, t) : null;
    const errorMsg   = fieldError || (shouldShowError ? (crossFieldError || null) : null);
    const isValid    = shouldShowError && !fieldError && !crossFieldError && (value || "").length > 0;

    const charCount    = (value || "").length;
    const counterClass = charCount > MAX_TEXT
        ? "field-counter counter-over"
        : charCount > MAX_TEXT * 0.85
        ? "field-counter counter-warn"
        : "field-counter";

    const inputClass = [
        "field-input",
        isValid  ? "is-valid"   : "",
        errorMsg ? "is-invalid" : ""
    ].filter(Boolean).join(" ");

    function handleChange(e) {
        let val = e.target.value;
        if (isNumberField) {
            val = val.replace(/[^0-9.]/g, "");
            const parts = val.split(".");
            if (parts.length > 2) val = parts[0] + "." + parts.slice(1).join("");
        }
        onChange(val);
    }

    function handleBlur() { setTouched(true); }

    const dateWrapClass = isDateField
        ? ["date-field-wrapper", isValid ? "date-valid" : "", errorMsg ? "date-invalid" : ""]
            .filter(Boolean).join(" ")
        : null;

    if (isTextarea) {
        return (
            <div>
                <textarea
                    className={inputClass}
                    rows="3"
                    placeholder={field.placeholder || ""}
                    value={value || ""}
                    onChange={handleChange}
                    onBlur={handleBlur}
                    maxLength={MAX_TEXT + 1}
                    data-field-name={field.name}
                />
                {showCounter && (
                    <div className={counterClass}>
                        {charCount.toLocaleString()} / {MAX_TEXT.toLocaleString()}
                    </div>
                )}
                {errorMsg && (
                    <div className="field-error">
                        <span className="error-icon">⚠</span>{errorMsg}
                    </div>
                )}
            </div>
        );
    }

    if (isDateField) {
        return (
            <div>
                <div className={dateWrapClass}>
                    <DatePicker
                        value={value || ""}
                        onChange={v => onChange(v)}
                        onBlur={handleBlur}
                        placeholder={field.placeholder || "DD/MM/YYYY"}
                        inputClass={inputClass}
                        fieldName={field.name}
                    />
                </div>
                {errorMsg && (
                    <div className="field-error">
                        <span className="error-icon">⚠</span>{errorMsg}
                    </div>
                )}
            </div>
        );
    }

    return (
        <div>
            <input
                className={inputClass}
                type="text"
                placeholder={field.placeholder || ""}
                value={value || ""}
                onChange={handleChange}
                onBlur={handleBlur}
                inputMode={isNumberField ? "decimal" : "text"}
                data-field-name={field.name}
            />
            {showCounter && (
                <div className={counterClass}>
                    {charCount.toLocaleString()} / {MAX_TEXT.toLocaleString()}
                </div>
            )}
            {errorMsg && (
                <div className="field-error">
                    <span className="error-icon">⚠</span>{errorMsg}
                </div>
            )}
        </div>
    );
}

/* ============================================================
   TEMPLATE-SPECIFIC EXTRAS REGISTRY
============================================================ */

function InvoiceExtras({ extrasState, setExtrasState }) {
    const { t }   = useLang();
    const taxRate = (extrasState.invoice && extrasState.invoice.taxRate) || "0";

    function setTaxRate(val) {
        setExtrasState(prev => ({
            ...prev,
            invoice: { ...prev.invoice, taxRate: val }
        }));
    }

    return (
        <div className="template-extras">
            <div className="tax-row">
                <label>{t("ui.tax_rate")}</label>
                <input
                    type="number" min="0" max="100" step="0.5"
                    value={taxRate}
                    onChange={e => setTaxRate(e.target.value)}
                    placeholder="0"
                />
                <span className="tax-hint">{t("ui.tax_hint")}</span>
            </div>
        </div>
    );
}

const EXTRAS_REGISTRY = {
    invoice: InvoiceExtras
};

/* ============================================================
   UNIVERSAL FORM RENDERER
   Resolves field labels and placeholders from the language
   dictionary at render time via t().
============================================================ */

function UniversalForm({
    template, documentData, updateField,
    addBlock, removeBlock, forceShowErrors
}) {
    const { t } = useLang();

    /* Resolve label and placeholder for a field from the active language */
    function fieldLabel(field) {
        if (!field.tplKey) return field.name;
        return t(`templates.${template.id}.fields.${field.tplKey}.label`);
    }

    function fieldPlaceholder(field) {
        if (!field.tplKey) return field.placeholder || "";
        return t(`templates.${template.id}.fields.${field.tplKey}.placeholder`);
    }

    return (
        <>
            {template.sections.map(section => {
                const blocks = Array.isArray(documentData[section.id])
                    ? documentData[section.id]
                    : [documentData[section.id]];

                /* Section title from language dictionary */
                const sectionTitle = section.sectionKey
                    ? t(`templates.${template.id}.sections.${section.sectionKey}`)
                    : section.id;

                return (
                    <div key={section.id} className="section-block">

                        <div className="section-label">{sectionTitle}</div>

                        {blocks.map((block, idx) => {
                            /* Compute cross-field errors with translated messages */
                            const crossErrors = {};
                            validateCrossFieldsWithT(section, block, t).forEach(({ fieldName, error }) => {
                                crossErrors[fieldName] = error;
                            });

                            return (
                                <div key={idx} className={section.repeatable ? "repeatable-block" : ""}>
                                    {section.repeatable && (
                                        <div className="repeatable-block-header">
                                            <span className="repeatable-block-index">
                                                #{String(idx + 1).padStart(2, "0")}
                                            </span>
                                            {blocks.length > 1 && (
                                                <button
                                                    className="btn-remove"
                                                    onClick={() => removeBlock(section, idx)}
                                                >
                                                    {t("ui.remove")}
                                                </button>
                                            )}
                                        </div>
                                    )}

                                    {section.fields.map(field => {
                                        /* Build a resolved field object with translated strings */
                                        const resolvedField = {
                                            ...field,
                                            label:       fieldLabel(field),
                                            placeholder: fieldPlaceholder(field)
                                        };

                                        return (
                                            <div key={field.name} className="field-group">
                                                <label className="field-label">
                                                    {resolvedField.label}
                                                    {field.optional && (
                                                        <span className="optional-badge">
                                                            {t("ui.optional")}
                                                        </span>
                                                    )}
                                                </label>
                                                <SmartField
                                                    field={resolvedField}
                                                    value={block[field.name]}
                                                    forceShowError={forceShowErrors}
                                                    crossFieldError={crossErrors[field.name] || null}
                                                    onChange={val =>
                                                        updateField(section.id, idx, field.name, val)
                                                    }
                                                />
                                            </div>
                                        );
                                    })}
                                </div>
                            );
                        })}

                        {section.repeatable && (
                            <button className="btn-add" onClick={() => addBlock(section)}>
                                + {t("ui.add_block")} {sectionTitle}
                            </button>
                        )}
                    </div>
                );
            })}
        </>
    );
}

/* ============================================================
   MAIN APP COMPONENT
============================================================ */

function App() {
    const { t, lang }           = useLang();
    const [stage,           setStage]           = useState("home");
    const [template,        setTemplate]        = useState(null);
    const [documentData,    setDocumentData]    = useState({});
    const [extrasState,     setExtrasState]     = useState({});
    const [search,          setSearch]          = useState("");
    const [forceShowErrors, setForceShowErrors] = useState(false);
    const [loadError,       setLoadError]       = useState("");
    const [uploadedImage,   setUploadedImage]   = useState(null);
    const [exporting,       setExporting]       = useState(false);

    const formPanelBodyRef = useRef(null);
    const previewDocRef    = useRef(null);

    function selectTemplate(tpl) {
        setTemplate(tpl);
        setDocumentData(initDocument(tpl));
        setForceShowErrors(false);
        setLoadError("");
        setUploadedImage(null);
        setExtrasState(prev => ({ ...prev, [tpl.id]: {} }));
        setStage("edit");
    }

    function updateField(sectionId, index, fieldName, value) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (Array.isArray(copy[sectionId])) {
                copy[sectionId][index][fieldName] = value;
            } else {
                copy[sectionId][fieldName] = value;
            }
            return copy;
        });
    }

    function addBlock(section) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            copy[section.id].push(initSection(section));
            return copy;
        });
    }

    function removeBlock(section, index) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (copy[section.id].length > 1) copy[section.id].splice(index, 1);
            return copy;
        });
    }

    async function handleExportPDF() {
        const errors = getAllFieldErrors(template, documentData, t);
        if (errors.length > 0) {
            setForceShowErrors(true);
            requestAnimationFrame(() => {
                const panel = formPanelBodyRef.current;
                if (!panel) return;
                const firstInvalid = panel.querySelector(".is-invalid");
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
                    firstInvalid.focus({ preventScroll: true });
                }
            });
            return;
        }
        setExporting(true);
        try {
            await exportPreviewToPDF(previewDocRef, template.id + ".pdf");
        } finally {
            setExporting(false);
        }
    }

    function handleSave() {
        saveProgressToFile(template, documentData, extrasState, uploadedImage);
    }

    async function handleLoad() {
        setLoadError("");
        try {
            const payload = await loadProgressFromFile();
            if (!payload.templateId || !payload.documentData) {
                setLoadError(t("ui.load_error_invalid"));
                return;
            }
            const tpl = TEMPLATES.find(tp => tp.id === payload.templateId);
            if (!tpl) {
                setLoadError(t("ui.load_error_missing"));
                return;
            }
            setTemplate(tpl);
            setDocumentData(payload.documentData);
            setExtrasState(payload.extrasState || {});
            setUploadedImage(payload.uploadedImage || null);
            setForceShowErrors(false);
            setLoadError("");
            setStage("edit");
        } catch {
            setLoadError(t("ui.load_error_file"));
        }
    }

    /* Build template cards with translated names from active language */
    const allTemplatesWithNames = TEMPLATES.map(tpl => ({
        ...tpl,
        name:        t(`templates.${tpl.id}.name`),
        description: t(`templates.${tpl.id}.description`),
        category:    t(`templates.${tpl.id}.category`),
        image: {
            ...tpl.image,
            label: t(`templates.${tpl.id}.image_label`)
        }
    }));

    const featuredTemplates = allTemplatesWithNames.filter(tpl => FEATURED_IDS.includes(tpl.id));
    const filteredTemplates = allTemplatesWithNames.filter(tpl =>
        tpl.name.toLowerCase().includes(search.toLowerCase()) ||
        tpl.description.toLowerCase().includes(search.toLowerCase()) ||
        tpl.category.toLowerCase().includes(search.toLowerCase())
    );

    /* Resolve the translated template for the active editor */
    const activeTemplate = template
        ? allTemplatesWithNames.find(tpl => tpl.id === template.id) || template
        : null;

    const ExtrasComponent = template ? (EXTRAS_REGISTRY[template.id] || null) : null;

    const templateCount = filteredTemplates.length;
    const countLabel    = templateCount === 1
        ? `1 ${t("ui.template_count_one")}`
        : `${templateCount} ${t("ui.template_count_many")}`;

    return (
        <div style={{ minHeight: "100vh" }}>

            {/* PDF export overlay */}
            {exporting && (
                <div className="pdf-overlay">
                    <div className="pdf-overlay-card">
                        <div className="pdf-overlay-spinner"></div>
                        <div className="pdf-overlay-title">{t("ui.pdf_generating")}</div>
                        <div className="pdf-overlay-sub">{t("ui.pdf_subtitle")}</div>
                    </div>
                </div>
            )}

            {/* ================================================
                HEADER
            ================================================ */}
            <header className="app-header">
                <div className="header-inner">
                    <div className="app-logo">
                        <div className="logo-mark">E</div>
                        <span className="logo-text">{t("ui.app_name")}</span>
                    </div>
                    <div className="header-right">
                        {stage === "edit" && (
                            <button className="btn-back" onClick={() => setStage("home")}>
                                {t("ui.back")}
                            </button>
                        )}
                        <LanguageSwitcher />
                    </div>
                </div>
            </header>

            {/* ================================================
                HOME SCREEN
            ================================================ */}
            {stage === "home" && (
                <div className="home-wrapper">

                    <div className="home-heading">
                        <h2>{t("ui.home_title")}</h2>
                        <p>{t("ui.home_subtitle")}</p>
                    </div>

                    <div className="home-section-heading">
                        <h3>{t("ui.featured")}</h3>
                        <div className="section-rule"></div>
                    </div>

                    <div className="template-grid" style={{ marginBottom: "0" }}>
                        {featuredTemplates.map((tpl, i) => (
                            <button
                                key={tpl.id}
                                className="template-card animate-in"
                                style={{ animationDelay: (i * 70) + "ms" }}
                                onClick={() => selectTemplate(
                                    TEMPLATES.find(tp => tp.id === tpl.id)
                                )}
                            >
                                <span className="card-icon">{tpl.icon}</span>
                                <div className="card-category">{tpl.category}</div>
                                <div className="card-name">{tpl.name}</div>
                                <div className="card-desc">{tpl.description}</div>
                            </button>
                        ))}
                    </div>

                    <hr className="home-divider" />

                    <div className="search-bar-wrapper">
                        <span className="search-icon">🔍</span>
                        <input
                            className="search-bar-input"
                            type="text"
                            placeholder={t("ui.search_placeholder")}
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                        />
                    </div>

                    <div className="all-docs-header">
                        <div className="home-section-heading" style={{ marginBottom: "0" }}>
                            <h3>{t("ui.all_documents")}</h3>
                            <div className="section-rule"></div>
                        </div>
                        <span className="all-docs-count">{countLabel}</span>
                    </div>

                    {filteredTemplates.length > 0 ? (
                        <div className="template-grid">
                            {filteredTemplates.map((tpl, i) => (
                                <button
                                    key={tpl.id}
                                    className="template-card animate-in"
                                    style={{ animationDelay: (i * 70) + "ms" }}
                                    onClick={() => selectTemplate(
                                        TEMPLATES.find(tp => tp.id === tpl.id)
                                    )}
                                >
                                    <span className="card-icon">{tpl.icon}</span>
                                    <div className="card-category">{tpl.category}</div>
                                    <div className="card-name">{tpl.name}</div>
                                    <div className="card-desc">{tpl.description}</div>
                                </button>
                            ))}
                        </div>
                    ) : (
                        <div className="no-results">
                            <span className="no-results-icon">🔍</span>
                            <p>{t("ui.no_results")} "<strong>{search}</strong>"</p>
                        </div>
                    )}

                </div>
            )}

            {/* ================================================
                EDITOR SCREEN
            ================================================ */}
            {stage === "edit" && template && activeTemplate && (
                <div className="editor-wrapper">
                    <div className="editor-grid">

                        {/* ---- FORM PANEL ---- */}
                        <div className="form-panel animate-in">

                            <div className="form-panel-header">
                                <span className="panel-icon">{template.icon}</span>
                                <h2 className="panel-title">{activeTemplate.name}</h2>
                            </div>

                            <div className="form-panel-body" ref={formPanelBodyRef}>

                                <ImageUploadZone
                                    imageConfig={activeTemplate.image}
                                    uploadedImage={uploadedImage}
                                    onImageChange={setUploadedImage}
                                />

                                <UniversalForm
                                    template={template}
                                    documentData={documentData}
                                    updateField={updateField}
                                    addBlock={addBlock}
                                    removeBlock={removeBlock}
                                    forceShowErrors={forceShowErrors}
                                />

                                {ExtrasComponent && (
                                    <ExtrasComponent
                                        extrasState={extrasState}
                                        setExtrasState={setExtrasState}
                                    />
                                )}

                            </div>

                            <div className="form-panel-footer">

                                <div className="footer-saveload-row">
                                    <button
                                        className="btn-secondary"
                                        onClick={handleSave}
                                        title={t("ui.save_progress")}
                                    >
                                        {t("ui.save_progress")}
                                    </button>
                                    <button
                                        className="btn-secondary"
                                        onClick={handleLoad}
                                        title={t("ui.load_progress")}
                                    >
                                        {t("ui.load_progress")}
                                    </button>
                                </div>

                                {loadError && (
                                    <div className="field-error">
                                        <span className="error-icon">⚠</span>
                                        {loadError}
                                    </div>
                                )}

                                <button
                                    className="btn-download"
                                    onClick={handleExportPDF}
                                    disabled={exporting}
                                >
                                    {exporting ? t("ui.generating") : t("ui.download_pdf")}
                                </button>

                            </div>

                        </div>

                        {/* ---- PREVIEW PANEL ---- */}
                        <div className="preview-panel animate-in" style={{ animationDelay: "80ms" }}>

                            <div className="preview-panel-header">
                                <span className="preview-label">{t("ui.live_preview")}</span>
                                <span className="preview-live-dot">{t("ui.live")}</span>
                            </div>

                            <div className="preview-scroll-area">
                                <UniversalPreview
                                    template={template}
                                    documentData={documentData}
                                    extrasState={extrasState}
                                    uploadedImage={uploadedImage}
                                    previewDocRef={previewDocRef}
                                />
                            </div>

                        </div>

                    </div>
                </div>
            )}

        </div>
    );
}

/* ============================================================
   ROOT — wrap App in LanguageProvider so t() is available
   everywhere in the component tree
============================================================ */

ReactDOM.createRoot(document.getElementById("root")).render(
    <LanguageProvider>
        <App />
    </LanguageProvider>
);

</script>
</body>
</html>
