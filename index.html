<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyDoc — Document Generator</title>

    <!-- Google Fonts: DM Sans + DM Mono -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- React -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* =====================================================
           CSS VARIABLES & RESET
        ===================================================== */
        :root {
            --navy:        #0f172a;
            --navy-mid:    #1e293b;
            --navy-light:  #334155;
            --accent:      #3b82f6;
            --accent-dark: #2563eb;
            --accent-soft: #eff6ff;
            --success:     #10b981;
            --danger:      #ef4444;
            --text-primary:   #0f172a;
            --text-secondary: #64748b;
            --text-muted:     #94a3b8;
            --border:      #e2e8f0;
            --border-focus:#3b82f6;
            --bg-page:     #f8fafc;
            --bg-card:     #ffffff;
            --bg-input:    #f8fafc;
            --shadow-sm:   0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md:   0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg:   0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
            --radius-sm:   6px;
            --radius-md:   10px;
            --radius-lg:   16px;
            --transition:  all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* =====================================================
           APP HEADER
        ===================================================== */
        .app-header {
            background: var(--navy);
            border-bottom: 1px solid var(--navy-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .app-logo .logo-mark {
            width: 30px;
            height: 30px;
            background: var(--accent);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .app-logo .logo-text {
            font-size: 17px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.3px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-back:hover {
            color: white;
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.22);
        }

        /* =====================================================
           HOME SCREEN
        ===================================================== */
        .home-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        .home-heading {
            text-align: center;
            margin-bottom: 48px;
        }

        .home-heading h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .home-heading p {
            font-size: 16px;
            color: var(--text-secondary);
            margin: 0;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .template-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .template-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .template-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
        }

        .template-card:hover::before {
            transform: scaleX(1);
        }

        .template-card .card-icon {
            font-size: 30px;
            margin-bottom: 16px;
            display: block;
        }

        .template-card .card-category {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .template-card .card-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .template-card .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* =====================================================
           EDITOR LAYOUT
        ===================================================== */
        .editor-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 60px;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =====================================================
           FORM PANEL
        ===================================================== */
        .form-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .form-panel-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-panel-header .panel-icon {
            font-size: 22px;
        }

        .form-panel-header .panel-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--text-primary);
            margin: 0;
        }

        .form-panel-body {
            padding: 24px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .form-panel-body::-webkit-scrollbar {
            width: 4px;
        }

        .form-panel-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .form-panel-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .section-block {
            margin-bottom: 28px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .repeatable-block {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 10px;
            background: var(--bg-input);
            position: relative;
        }

        .repeatable-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .repeatable-block-index {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 5px;
            letter-spacing: 0.1px;
        }

        .field-input {
            width: 100%;
            padding: 9px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            color: var(--text-primary);
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            appearance: none;
            -webkit-appearance: none;
        }

        .field-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .field-input::placeholder {
            color: var(--text-muted);
        }

        textarea.field-input {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .btn-remove {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--danger);
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-remove:hover {
            background: rgba(239,68,68,0.12);
            border-color: rgba(239,68,68,0.3);
        }

        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1.5px dashed rgba(59,130,246,0.35);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            justify-content: center;
            margin-top: 4px;
        }

        .btn-add:hover {
            background: #dbeafe;
            border-color: var(--accent);
        }

        .form-panel-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-input);
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.1px;
        }

        .btn-download:hover {
            background: var(--accent-dark);
            box-shadow: 0 4px 14px rgba(59,130,246,0.4);
            transform: translateY(-1px);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        /* =====================================================
           PREVIEW PANEL
        ===================================================== */
        .preview-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            position: sticky;
            top: 78px;
        }

        .preview-panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preview-panel-header .preview-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .preview-live-dot {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 500;
            color: var(--success);
        }

        .preview-live-dot::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.85); }
        }

        .preview-scroll-area {
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            overflow-x: hidden;
            background: #f1f5f9;
        }

        .preview-scroll-area::-webkit-scrollbar {
            width: 4px;
        }

        .preview-scroll-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* =====================================================
           PREVIEW DOCUMENT STYLES
        ===================================================== */
        .preview-doc {
            background: white;
            margin: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 36px 36px 44px;
            min-height: 400px;
            font-size: 11.5px;
            line-height: 1.65;
            color: #1e293b;
            font-family: 'DM Sans', sans-serif;
        }

        /* Resume Preview */
        .preview-doc .resume-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--navy);
            margin-bottom: 2px;
        }

        .preview-doc .resume-title {
            font-size: 13px;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .preview-doc .resume-contact {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--navy);
            margin-bottom: 18px;
        }

        .preview-doc .section-heading {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-top: 20px;
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .preview-doc .exp-role {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .preview-doc .exp-company {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .preview-doc .exp-period {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
        }

        .preview-doc .exp-description {
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: pre-wrap;
        }

        .preview-doc .edu-degree {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .preview-doc .edu-school {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .preview-doc .edu-year {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
        }

        /* Invoice Preview */
        .preview-doc .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--navy);
        }

        .preview-doc .invoice-brand {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: -0.5px;
        }

        .preview-doc .invoice-tag {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .preview-doc .invoice-meta {
            text-align: right;
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .preview-doc .invoice-meta strong {
            color: var(--text-primary);
            font-family: 'DM Mono', monospace;
        }

        .preview-doc .invoice-parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .preview-doc .party-box {
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent);
        }

        .preview-doc .party-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .preview-doc .party-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .preview-doc .party-detail {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        .preview-doc .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            font-size: 11.5px;
        }

        .preview-doc .items-table thead th {
            padding: 8px 10px;
            text-align: left;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: white;
            background: var(--navy);
        }

        .preview-doc .items-table thead th:last-child {
            text-align: right;
        }

        .preview-doc .items-table tbody tr {
            border-bottom: 1px solid var(--border);
        }

        .preview-doc .items-table tbody tr:last-child {
            border-bottom: none;
        }

        .preview-doc .items-table tbody td {
            padding: 8px 10px;
            color: var(--text-primary);
            vertical-align: top;
        }

        .preview-doc .items-table tbody td:last-child {
            text-align: right;
            font-family: 'DM Mono', monospace;
        }

        .preview-doc .items-table tbody td.qty-cell {
            color: var(--text-secondary);
            text-align: center;
        }

        .preview-doc .items-table tbody td.price-cell {
            color: var(--text-secondary);
            font-family: 'DM Mono', monospace;
            text-align: right;
        }

        .preview-doc .invoice-totals {
            margin-left: auto;
            width: 220px;
        }

        .preview-doc .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 11.5px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .preview-doc .total-row:last-child {
            border-bottom: none;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--navy);
            margin-top: 4px;
            padding-top: 8px;
        }

        .preview-doc .total-row .total-value {
            font-family: 'DM Mono', monospace;
        }

        .preview-doc .invoice-notes {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* =====================================================
           EMPTY STATE
        ===================================================== */
        .empty-preview {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-preview .empty-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-preview p {
            font-size: 13px;
            margin: 0;
        }

        /* =====================================================
           INVOICE TAX FIELD
        ===================================================== */
        .tax-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .tax-row label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tax-row input {
            width: 80px;
            padding: 7px 10px;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            color: var(--text-primary);
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .tax-row input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .tax-row .tax-hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* =====================================================
           ANIMATIONS
        ===================================================== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .animate-in:nth-child(1) { animation-delay: 0ms;  }
        .animate-in:nth-child(2) { animation-delay: 60ms; }
        .animate-in:nth-child(3) { animation-delay: 120ms; }
        .animate-in:nth-child(4) { animation-delay: 180ms; }

    </style>
</head>
<body>
<div id="root"></div><script type="text/babel">
const { useState } = React;
const { jsPDF } = window.jspdf;

/* ============================================================
   TEMPLATE CONFIGURATION
============================================================ */

const TEMPLATES = [
    {
        id: "resume",
        name: "Professional Resume",
        icon: "📄",
        category: "Personal",
        description: "Clean, modern resume for any industry",
        sections: [
            {
                id: "header",
                title: "Personal Info",
                fields: [

/* ============================================================
   DOCUMENT INITIALIZATION
============================================================ */

function initSection(section) {
    const obj = {};
    section.fields.forEach(field => {
        obj[field.name] = "";
    });
    return obj;
}

function initDocument(template) {
    const data = {};
    template.sections.forEach(section => {
        if (section.repeatable) {
            data[section.id] = [initSection(section)];
        } else {
            data[section.id] = initSection(section);
        }
    });
    return data;
}

/* ============================================================
   INVOICE CALCULATION HELPERS
============================================================ */

function parseNumber(val) {
    const n = parseFloat(String(val).replace(/[^0-9.]/g, ""));
    return isNaN(n) ? 0 : n;
}

function calcInvoiceTotals(items, taxRate) {
    const subtotal = items.reduce((sum, row) => {
        const qty   = parseNumber(row.qty);
        const price = parseNumber(row.price);
        return sum + qty * price;
    }, 0);

    const taxAmount = subtotal * (parseNumber(taxRate) / 100);
    const total     = subtotal + taxAmount;

    return { subtotal, taxAmount, total };
}

function formatMoney(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

/* ============================================================
   PDF ENGINE
============================================================ */

function createPDFEngine() {
    const pdf         = new jsPDF("p", "mm", "a4");
    const margin      = 18;
    const pageHeight  = pdf.internal.pageSize.getHeight();
    const pageWidth   = pdf.internal.pageSize.getWidth();
    const usableWidth = pageWidth - margin * 2;

    let cursorY = margin;

    function ensureSpace(heightNeeded) {
        if (cursorY + heightNeeded > pageHeight - margin) {
            pdf.addPage();
            cursorY = margin;
        }
    }

    function addText(text, fontSize, isBold, color, xOverride) {
        if (!text && text !== 0) return;
        pdf.setFont("helvetica", isBold ? "bold" : "normal");
        pdf.setFontSize(fontSize || 10);
        if (color) {
            pdf.setTextColor(color[0], color[1], color[2]);
        } else {
            pdf.setTextColor(30, 41, 59);
        }
        const x     = xOverride !== undefined ? xOverride : margin;
        const lines = pdf.splitTextToSize(String(text), usableWidth);
        const lh    = (fontSize || 10) * 0.38 + 1.8;
        ensureSpace(lines.length * lh + 2);
        pdf.text(lines, x, cursorY);
        cursorY += lines.length * lh;
    }

    function addTextRight(text, fontSize, isBold, color) {
        if (!text && text !== 0) return;
        pdf.setFont("helvetica", isBold ? "bold" : "normal");
        pdf.setFontSize(fontSize || 10);
        if (color) {
            pdf.setTextColor(color[0], color[1], color[2]);
        } else {
            pdf.setTextColor(30, 41, 59);
        }
        const textWidth = pdf.getTextWidth(String(text));
        pdf.text(String(text), pageWidth - margin - textWidth, cursorY);
    }

    function addLabelValue(label, value, fontSize) {
        if (!value) return;
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(fontSize || 9);
        pdf.setTextColor(100, 116, 139);
        const lw = pdf.getTextWidth(label + "  ");
        ensureSpace(6);
        pdf.text(label, margin, cursorY);
        pdf.setFont("helvetica", "normal");
        pdf.setTextColor(30, 41, 59);
        const lines = pdf.splitTextToSize(String(value), usableWidth - lw);
        pdf.text(lines, margin + lw, cursorY);
        cursorY += lines.length * ((fontSize || 9) * 0.38 + 1.8);
    }

    function addSpacing(space) {
        cursorY += (space || 5);
    }

    function addHRule(color) {
        const c = color || [226, 232, 240];
        pdf.setDrawColor(c[0], c[1], c[2]);
        pdf.setLineWidth(0.4);
        ensureSpace(3);
        pdf.line(margin, cursorY, pageWidth - margin, cursorY);
        cursorY += 3;
    }

    function addRect(x, y, w, h, fillColor) {
        pdf.setFillColor(fillColor[0], fillColor[1], fillColor[2]);
        pdf.rect(x, y, w, h, "F");
    }

    function addSectionHeading(title) {
        addSpacing(6);
        ensureSpace(10);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(8);
        pdf.setTextColor(59, 130, 246);
        pdf.text(title.toUpperCase(), margin, cursorY);
        cursorY += 5;
        addHRule([59, 130, 246]);
        addSpacing(2);
    }

    return {
        pdf,
        cursorY: () => cursorY,
        setCursorY: (y) => { cursorY = y; },
        margin,
        pageWidth,
        pageHeight,
        usableWidth,
        ensureSpace,
        addText,
        addTextRight,
        addLabelValue,
        addSpacing,
        addHRule,
        addRect,
        addSectionHeading
    };
}

/* ============================================================
   RESUME PDF RENDERER
============================================================ */

function exportResumePDF(documentData) {
    const eng = createPDFEngine();
    const {
        pdf, margin, pageWidth, usableWidth,
        addText, addTextRight, addSpacing, addHRule,
        addSectionHeading, ensureSpace, setCursorY, cursorY
    } = eng;

    const hdr = documentData.header || {};

    /* Name */
    if (hdr.name) {
        addText(hdr.name, 22, true, [15, 23, 42]);
        addSpacing(1);
    }

    /* Professional title */
    if (hdr.title) {
        addText(hdr.title, 11, false, [59, 130, 246]);
        addSpacing(2);
    }

    /* Contact line */
    const contactParts = [hdr.email, hdr.phone].filter(Boolean);
    if (contactParts.length > 0) {
        addText(contactParts.join("   •   "), 9, false, [100, 116, 139]);
        addSpacing(2);
    }

    /* Divider */
    pdf.setDrawColor(15, 23, 42);
    pdf.setLineWidth(0.8);
    const cy = eng.cursorY();
    pdf.line(margin, cy, pageWidth - margin, cy);
    eng.setCursorY(cy + 4);

    /* Summary */
    const sum = documentData.summary || {};
    if (sum.summary) {
        addSectionHeading("Professional Summary");
        addText(sum.summary, 10, false, [71, 85, 105]);
        addSpacing(2);
    }

    /* Experience */
    const expList = documentData.experience || [];
    const hasExp  = expList.some(e => e.role || e.company);
    if (hasExp) {
        addSectionHeading("Experience");
        expList.forEach(exp => {
            if (!exp.role && !exp.company) return;
            ensureSpace(14);
            if (exp.role) {
                addText(exp.role, 11, true, [15, 23, 42]);
            }
            if (exp.company || exp.period) {
                const line = [exp.company, exp.period].filter(Boolean).join("  ·  ");
                addText(line, 9.5, false, [100, 116, 139]);
            }
            if (exp.description) {
                addSpacing(1);
                addText(exp.description, 9.5, false, [71, 85, 105]);
            }
            addSpacing(5);
        });
    }

    /* Education */
    const eduList = documentData.education || [];
    const hasEdu  = eduList.some(e => e.degree || e.school);
    if (hasEdu) {
        addSectionHeading("Education");
        eduList.forEach(edu => {
            if (!edu.degree && !edu.school) return;
            ensureSpace(10);
            if (edu.degree) {
                addText(edu.degree, 11, true, [15, 23, 42]);
            }
            if (edu.school || edu.year) {
                const line = [edu.school, edu.year].filter(Boolean).join("  ·  ");
                addText(line, 9.5, false, [100, 116, 139]);
            }
            addSpacing(4);
        });
    }

    pdf.save("resume.pdf");
}

/* ============================================================
   INVOICE PDF RENDERER
============================================================ */

function exportInvoicePDF(documentData, taxRate) {
    const eng = createPDFEngine();
    const {
        pdf, margin, pageWidth, usableWidth,
        addText, addSpacing, addHRule, ensureSpace,
        addRect, cursorY, setCursorY
    } = eng;

    const sender = documentData.sender || {};
    const hdr    = documentData.header || {};
    const client = documentData.client || {};
    const items  = documentData.items  || [];

    /* ---- TOP HEADER BAR ---- */
    addRect(0, 0, pageWidth, 28, [15, 23, 42]);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(16);
    pdf.setTextColor(255, 255, 255);
    pdf.text(sender.senderName || "INVOICE", margin, 17);

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(9);
    pdf.setTextColor(148, 163, 184);
    const invLabel = "INVOICE";
    const invLabelW = pdf.getTextWidth(invLabel);
    pdf.text(invLabel, pageWidth - margin - invLabelW, 17);

    setCursorY(36);

    /* ---- INVOICE META (right side) ---- */
    const metaStartY = eng.cursorY();
    const metaX      = pageWidth - margin - 60;

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(8);
    pdf.setTextColor(100, 116, 139);

    const metaRows = [
        ["Invoice No.", hdr.invoiceNumber],
        ["Issue Date",  hdr.date],
        ["Due Date",    hdr.dueDate]
    ].filter(row => row[1]);

    metaRows.forEach((row, i) => {
        const rowY = metaStartY + i * 7;
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(8);
        pdf.setTextColor(100, 116, 139);
        pdf.text(row[0], metaX, rowY);

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(8.5);
        pdf.setTextColor(15, 23, 42);
        const valW = pdf.getTextWidth(row[1]);
        pdf.text(row[1], pageWidth - margin - valW, rowY);
    });

    /* ---- FROM / TO BOXES ---- */
    const boxY = metaStartY;
    const boxW = 70;

    addRect(margin, boxY, boxW, 36, [248, 250, 252]);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(7.5);
    pdf.setTextColor(148, 163, 184);
    pdf.text("FROM", margin + 5, boxY + 7);

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(9.5);
    pdf.setTextColor(15, 23, 42);
    pdf.text(sender.senderName || "", margin + 5, boxY + 14, { maxWidth: boxW - 10 });

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(8);
    pdf.setTextColor(100, 116, 139);
    if (sender.senderAddress) {
        pdf.text(sender.senderAddress, margin + 5, boxY + 20, { maxWidth: boxW - 10 });
    }
    if (sender.senderEmail) {
        pdf.text(sender.senderEmail, margin + 5, boxY + 30, { maxWidth: boxW - 10 });
    }

    const toBoxX = margin + boxW + 6;
    addRect(toBoxX, boxY, boxW, 36, [239, 246, 255]);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(7.5);
    pdf.setTextColor(59, 130, 246);
    pdf.text("BILL TO", toBoxX + 5, boxY + 7);

    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(9.5);
    pdf.setTextColor(15, 23, 42);
    pdf.text(client.clientName || "", toBoxX + 5, boxY + 14, { maxWidth: boxW - 10 });

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(8);
    pdf.setTextColor(100, 116, 139);
    if (client.clientAddress) {
        pdf.text(client.clientAddress, toBoxX + 5, boxY + 20, { maxWidth: boxW - 10 });
    }
    if (client.clientEmail) {
        pdf.text(client.clientEmail, toBoxX + 5, boxY + 30, { maxWidth: boxW - 10 });
    }

    setCursorY(boxY + 44);

    /* ---- ITEMS TABLE ---- */
    const tableTop    = eng.cursorY();
    const colDesc     = margin;
    const colQty      = margin + usableWidth * 0.52;
    const colPrice    = margin + usableWidth * 0.67;
    const colTotal    = margin + usableWidth * 0.82;
    const tableRight  = pageWidth - margin;

    /* Table header row */
    addRect(margin, tableTop, usableWidth, 8, [15, 23, 42]);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(7.5);
    pdf.setTextColor(255, 255, 255);
    const thY = tableTop + 5.5;
    pdf.text("DESCRIPTION", colDesc + 3, thY);
    pdf.text("QTY",         colQty,      thY);
    pdf.text("UNIT PRICE",  colPrice,    thY);
    pdf.text("TOTAL",       colTotal,    thY);

    setCursorY(tableTop + 10);

    /* Table rows */
    items.forEach((row, i) => {
        const qty   = parseNumber(row.qty);
        const price = parseNumber(row.price);
        const line  = qty * price;
        const rowY  = eng.cursorY();
        const rowH  = 8;

        ensureSpace(rowH + 2);

        if (i % 2 === 1) {
            addRect(margin, rowY - 1, usableWidth, rowH, [248, 250, 252]);
        }

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(9);
        pdf.setTextColor(30, 41, 59);
        pdf.text(row.item || "", colDesc + 3, rowY + 5, { maxWidth: colQty - colDesc - 6 });

        pdf.setTextColor(100, 116, 139);
        pdf.text(String(qty > 0 ? qty : row.qty || ""), colQty, rowY + 5);

        pdf.text(price > 0 ? formatMoney(price) : (row.price || ""), colPrice, rowY + 5);

        pdf.setFont("helvetica", "bold");
        pdf.setTextColor(15, 23, 42);
        pdf.text(line > 0 ? formatMoney(line) : "", colTotal, rowY + 5);

        setCursorY(rowY + rowH);
    });

    addSpacing(2);

    /* Divider under items */
    pdf.setDrawColor(226, 232, 240);
    pdf.setLineWidth(0.3);
    const divY = eng.cursorY();
    pdf.line(margin, divY, pageWidth - margin, divY);
    setCursorY(divY + 4);

    /* ---- TOTALS ---- */
    const { subtotal, taxAmount, total } = calcInvoiceTotals(items, taxRate);
    const totX      = pageWidth - margin - 68;
    const totValX   = pageWidth - margin;
    let totY        = eng.cursorY();

    function addTotalRow(label, value, bold, big) {
        ensureSpace(7);
        pdf.setFont("helvetica", bold ? "bold" : "normal");
        pdf.setFontSize(big ? 10.5 : 9);
        pdf.setTextColor(bold && big ? 15 : 100, bold && big ? 23 : 116, bold && big ? 42 : 139);
        pdf.text(label, totX, totY);

        const valStr = formatMoney(value);
        const valW   = pdf.getTextWidth(valStr);
        pdf.setFont("helvetica", bold ? "bold" : "normal");
        pdf.setFontSize(big ? 10.5 : 9);
        pdf.setTextColor(big ? 15 : 30, big ? 23 : 41, big ? 42 : 59);
        pdf.text(valStr, totValX - valW, totY);
        totY += 6;
        eng.setCursorY(totY);
    }

    addTotalRow("Subtotal", subtotal, false, false);

    const taxRateNum = parseNumber(taxRate);
    if (taxRateNum > 0) {
        addTotalRow("Tax (" + taxRateNum + "%)", taxAmount, false, false);
    }

    pdf.setDrawColor(226, 232, 240);
    pdf.setLineWidth(0.3);
    pdf.line(totX, totY, totValX, totY);
    totY += 4;
    eng.setCursorY(totY);

    addTotalRow("Total Due", total, true, true);

    /* ---- FOOTER ---- */
    addSpacing(16);
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(8);
    pdf.setTextColor(148, 163, 184);
    const footerText = "Thank you for your business.";
    const ftW = pdf.getTextWidth(footerText);
    pdf.text(footerText, (pageWidth - ftW) / 2, eng.cursorY());

    pdf.save("invoice.pdf");
}

    }

                    <div className="party-box">
                        <div className="party-label">From</div>
                        {sender.senderName    && <div className="party-name">{sender.senderName}</div>}
                        {sender.senderAddress && <div className="party-detail">{sender.senderAddress}</div>}
                        {sender.senderEmail   && <div className="party-detail" style={{ color: "#3b82f6" }}>{sender.senderEmail}</div>}
                    </div>
                    <div className="party-box">
                        <div className="party-label">Bill To</div>
                        {client.clientName    && <div className="party-name">{client.clientName}</div>}
                        {client.clientAddress && <div className="party-detail">{client.clientAddress}</div>}
                        {client.clientEmail   && <div className="party-detail" style={{ color: "#3b82f6" }}>{client.clientEmail}</div>}
                    </div>
                </div>
            )}

            {/* Items Table */}
            {items.some(i => i.item) && (
                <table className="items-table">
                    <thead>
                        <tr>
                            <th style={{ width: "50%" }}>Description</th>
                            <th style={{ width: "12%", textAlign: "center" }}>Qty</th>
                            <th style={{ width: "18%", textAlign: "right" }}>Unit Price</th>
                            <th style={{ width: "20%", textAlign: "right" }}>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        {items.map((row, i) => {
                            const qty   = parseNumber(row.qty);
                            const price = parseNumber(row.price);
                            const line  = qty * price;
                            return (
                                <tr key={i}>
                                    <td>{row.item || ""}</td>
                                    <td className="qty-cell">{row.qty || ""}</td>
                                    <td className="price-cell">
                                        {row.price ? formatMoney(parseNumber(row.price)) : ""}
                                    </td>
                                    <td style={{ textAlign: "right", fontFamily: "'DM Mono', monospace" }}>
                                        {line > 0 ? formatMoney(line) : ""}
                                    </td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            )}

            {/* Totals */}
            {subtotal > 0 && (
                <div className="invoice-totals">
                    <div className="total-row">
                        <span>Subtotal</span>
                        <span className="total-value">{formatMoney(subtotal)}</span>
                    </div>
                    {taxRateNum > 0 && (
                        <div className="total-row">
                            <span>Tax ({taxRateNum}%)</span>
                            <span className="total-value">{formatMoney(taxAmount)}</span>
                        </div>
                    )}
                    <div className="total-row">
                        <span>Total Due</span>
                        <span className="total-value">{formatMoney(total)}</span>
                    </div>
                </div>
            )}

            {/* Footer note */}
            <div className="invoice-notes">Thank you for your business.</div>

        </div>
    );
}

/* ============================================================
   UNIFIED PREVIEW DISPATCHER
============================================================ */

function Preview({ template, data, taxRate }) {
    if (!template) return null;

    if (template.id === "resume") {
        return <ResumePreview data={data} />;
    }

    if (template.id === "invoice") {
        return <InvoicePreview data={data} taxRate={taxRate} />;
    }

    return null;
}/* ============================================================
   MAIN APP COMPONENT
============================================================ */

function App() {
    const [stage,        setStage]        = useState("home");
    const [template,     setTemplate]     = useState(null);
    const [documentData, setDocumentData] = useState({});
    const [taxRate,      setTaxRate]      = useState("0");

    function selectTemplate(tpl) {
        setTemplate(tpl);
        setDocumentData(initDocument(tpl));
        setTaxRate("0");
        setStage("edit");
    }

    function updateField(sectionId, index, fieldName, value) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (Array.isArray(copy[sectionId])) {
                copy[sectionId][index][fieldName] = value;
            } else {
                copy[sectionId][fieldName] = value;
            }
            return copy;
        });
    }

    function addBlock(section) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            copy[section.id].push(initSection(section));
            return copy;
        });
    }

    function removeBlock(section, index) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (copy[section.id].length > 1) {
                copy[section.id].splice(index, 1);
            }
            return copy;
        });
    }

    function handleExportPDF() {
        exportPDF(template, documentData, taxRate);
    }

    return (
        <div style={{ minHeight: "100vh" }}>

            {/* ================================================
                HEADER
            ================================================ */}
            <header className="app-header">
                <div className="header-inner">
                    <div className="app-logo">
                        <div className="logo-mark">E</div>
                        <span className="logo-text">EasyDoc</span>
                    </div>
                    {stage === "edit" && (
                        <button
                            className="btn-back"
                            onClick={() => setStage("home")}
                        >
                            ← Back
                        </button>
                    )}
                </div>
            </header>

            {/* ================================================
                HOME SCREEN
            ================================================ */}
            {stage === "home" && (
                <div className="home-wrapper">
                    <div className="home-heading">
                        <h2>What would you like to create?</h2>
                        <p>Choose a template and build a professional document in minutes</p>
                    </div>
                    <div className="template-grid">
                        {TEMPLATES.map((tpl, i) => (
                            <button
                                key={tpl.id}
                                className="template-card animate-in"
                                style={{ animationDelay: (i * 70) + "ms" }}
                                onClick={() => selectTemplate(tpl)}
                            >
                                <span className="card-icon">{tpl.icon}</span>
                                <div className="card-category">{tpl.category}</div>
                                <div className="card-name">{tpl.name}</div>
                                <div className="card-desc">{tpl.description}</div>
                            </button>
                        ))}
                    </div>
                </div>
            )}

            {/* ================================================
                EDITOR SCREEN
            ================================================ */}
            {stage === "edit" && template && (
                <div className="editor-wrapper">
                    <div className="editor-grid">

                        {/* ---- FORM PANEL ---- */}
                        <div className="form-panel animate-in">

                            <div className="form-panel-header">
                                <span className="panel-icon">{template.icon}</span>
                                <h2 className="panel-title">{template.name}</h2>
                            </div>

                            <div className="form-panel-body">

                                {template.sections.map(section => (
                                    <div key={section.id} className="section-block">

                                        <div className="section-label">
                                            {section.title}
                                        </div>

                                        {(Array.isArray(documentData[section.id])
                                            ? documentData[section.id]
                                            : [documentData[section.id]]
                                        ).map((block, idx) => (
                                            <div
                                                key={idx}
                                                className={section.repeatable ? "repeatable-block" : ""}
                                            >
                                                {section.repeatable && (
                                                    <div className="repeatable-block-header">
                                                        <span className="repeatable-block-index">
                                                            #{String(idx + 1).padStart(2, "0")}
                                                        </span>
                                                        {documentData[section.id].length > 1 && (
                                                            <button
                                                                className="btn-remove"
                                                                onClick={() => removeBlock(section, idx)}
                                                            >
                                                                ✕ Remove
                                                            </button>
                                                        )}
                                                    </div>
                                                )}

                                                {section.fields.map(field => (
                                                    <div key={field.name} className="field-group">
                                                        <label className="field-label">
                                                            {field.label}
                                                        </label>
                                                        {field.type === "textarea" ? (
                                                            <textarea
                                                                className="field-input"
                                                                rows="3"
                                                                placeholder={field.placeholder || ""}
                                                                value={block[field.name]}
                                                                onChange={e =>
                                                                    updateField(
                                                                        section.id,
                                                                        idx,
                                                                        field.name,
                                                                        e.target.value
                                                                    )
                                                                }
                                                            />
                                                        ) : (
                                                            <input
                                                                className="field-input"
                                                                type="text"
                                                                placeholder={field.placeholder || ""}
                                                                value={block[field.name]}
                                                                onChange={e =>
                                                                    updateField(
                                                                        section.id,
                                                                        idx,
                                                                        field.name,
                                                                        e.target.value
                                                                    )
                                                                }
                                                            />
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        ))}

                                        {section.repeatable && (
                                            <button
                                                className="btn-add"
                                                onClick={() => addBlock(section)}
                                            >
                                                + Add {section.title}
                                            </button>
                                        )}
                                    </div>
                                ))}

                                {/* Tax rate field — only shown for invoice */}
                                {template.id === "invoice" && (
                                    <div className="tax-row">
                                        <label>Tax Rate</label>
                                        <input
                                            type="number"
                                            min="0"
                                            max="100"
                                            step="0.5"
                                            value={taxRate}
                                            onChange={e => setTaxRate(e.target.value)}
                                            placeholder="0"
                                        />
                                        <span className="tax-hint">% (leave 0 for no tax)</span>
                                    </div>
                                )}

                            </div>

                            <div className="form-panel-footer">
                                <button
                                    className="btn-download"
                                    onClick={handleExportPDF}
                                >
                                    ↓ Download PDF
                                </button>
                            </div>

                        </div>

                        {/* ---- PREVIEW PANEL ---- */}
                        <div className="preview-panel animate-in" style={{ animationDelay: "80ms" }}>

                            <div className="preview-panel-header">
                                <span className="preview-label">Live Preview</span>
                                <span className="preview-live-dot">Live</span>
                            </div>

                            <div className="preview-scroll-area">
                                <Preview
                                    template={template}
                                    data={documentData}
                                    taxRate={taxRate}
                                />
                            </div>

                        </div>

                    </div>
                </div>
            )}

        </div>
    );
}

/* ============================================================
   MOUNT
============================================================ */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
