<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyDoc — Document Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --navy:           #0f172a;
            --navy-mid:       #1e293b;
            --navy-light:     #334155;
            --accent:         #3b82f6;
            --accent-dark:    #2563eb;
            --accent-soft:    #eff6ff;
            --success:        #10b981;
            --danger:         #ef4444;
            --warning:        #f59e0b;
            --text-primary:   #0f172a;
            --text-secondary: #64748b;
            --text-muted:     #94a3b8;
            --border:         #e2e8f0;
            --border-focus:   #3b82f6;
            --bg-page:        #f8fafc;
            --bg-card:        #ffffff;
            --bg-input:       #f8fafc;
            --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md:  0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg:  0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
            --radius-sm:  6px;
            --radius-md:  10px;
            --radius-lg:  16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* =====================================================
           APP HEADER
        ===================================================== */
        .app-header {
            background: var(--navy);
            border-bottom: 1px solid var(--navy-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .app-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .app-logo .logo-mark {
            width: 30px; height: 30px;
            background: var(--accent);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; color: white;
            letter-spacing: -0.5px; flex-shrink: 0;
        }

        .app-logo .logo-text {
            font-size: 17px; font-weight: 700;
            color: white; letter-spacing: -0.3px;
        }

        /* Header right side — back button + language switcher */
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            color: rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
        }

        .btn-back:hover {
            color: white; background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.22);
        }

        /* =====================================================
           LANGUAGE SWITCHER
        ===================================================== */
        .lang-switcher {
            position: relative;
        }

        .lang-trigger {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 10px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            color: rgba(255,255,255,0.80);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
            white-space: nowrap;
        }

        .lang-trigger:hover {
            color: white; background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.22);
        }

        .lang-trigger .lang-flag { font-size: 15px; line-height: 1; }
        .lang-trigger .lang-code { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
        .lang-trigger .lang-chevron { font-size: 9px; opacity: 0.6; margin-left: 2px; }

        .lang-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 160px;
            background: var(--navy-mid);
            border: 1px solid var(--navy-light);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            z-index: 200;
            animation: fadeInDown 0.15s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .lang-option {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 10px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 400;
            color: rgba(255,255,255,0.75);
            background: transparent; border: none; cursor: pointer;
            transition: var(--transition); text-align: left;
        }

        .lang-option:hover { background: rgba(255,255,255,0.08); color: white; }

        .lang-option.is-active {
            color: white; font-weight: 600;
            background: rgba(59,130,246,0.2);
        }

        .lang-option .opt-flag { font-size: 16px; }

        .lang-option .opt-name { flex: 1; }

        .lang-option .opt-check { font-size: 11px; color: var(--accent); opacity: 0; }

        .lang-option.is-active .opt-check { opacity: 1; }

        /* =====================================================
           HOME SCREEN
        ===================================================== */
        .home-wrapper { max-width: 1100px; margin: 0 auto; padding: 60px 24px 80px; }

        @media (max-width: 600px) { .home-wrapper { padding: 32px 16px 60px; } }

        .home-heading { text-align: center; margin-bottom: 48px; }

        .home-heading h2 {
            font-size: 32px; font-weight: 700; letter-spacing: -0.6px;
            color: var(--text-primary); margin-bottom: 10px;
        }

        .home-heading p { font-size: 16px; color: var(--text-secondary); margin: 0; }

        @media (max-width: 600px) {
            .home-heading h2 { font-size: 24px; }
            .home-heading p  { font-size: 14px; }
        }

        .home-section-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

        .home-section-heading h3 {
            font-size: 13px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-muted); margin: 0; white-space: nowrap;
        }

        .home-section-heading .section-rule { flex: 1; height: 1px; background: var(--border); }
        .home-divider { border: none; border-top: 1px solid var(--border); margin: 48px 0; }

        .search-bar-wrapper { position: relative; margin-bottom: 28px; }

        .search-bar-wrapper .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px; pointer-events: none;
        }

        .search-bar-input {
            width: 100%; padding: 10px 14px 10px 40px;
            font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-primary);
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: var(--radius-md); outline: none;
            transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow-sm);
        }

        .search-bar-input:focus {
            border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .search-bar-input::placeholder { color: var(--text-muted); }

        .all-docs-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 20px;
        }

        .all-docs-count {
            font-size: 12px; font-weight: 500;
            color: var(--text-muted); font-family: 'DM Mono', monospace;
        }

        .no-results { text-align: center; padding: 52px 20px; color: var(--text-muted); }
        .no-results .no-results-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; display: block; }
        .no-results p { font-size: 14px; margin: 0; }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        @media (max-width: 600px) { .template-grid { grid-template-columns: 1fr; gap: 12px; } }

        .template-card {
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: var(--radius-lg); padding: 28px 24px;
            cursor: pointer; text-align: left; width: 100%;
            font-family: 'DM Sans', sans-serif; transition: var(--transition);
            box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
        }

        @media (max-width: 600px) { .template-card { padding: 20px 18px; } }

        .template-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .template-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-3px); }
        .template-card:hover::before { transform: scaleX(1); }
        .template-card .card-icon { font-size: 30px; margin-bottom: 16px; display: block; }

        .template-card .card-category {
            font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
        }

        .template-card .card-name {
            font-size: 18px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 6px; letter-spacing: -0.2px;
        }

        .template-card .card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        /* =====================================================
           EDITOR LAYOUT
        ===================================================== */
        .editor-wrapper { max-width: 1200px; margin: 0 auto; padding: 32px 24px 60px; }

        @media (max-width: 600px) { .editor-wrapper { padding: 16px 12px 40px; } }

        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }

        @media (max-width: 900px) { .editor-grid { grid-template-columns: 1fr; gap: 20px; } }

        /* =====================================================
           FORM PANEL
        ===================================================== */
        .form-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden;
        }

        .form-panel-header {
            padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }

        @media (max-width: 600px) { .form-panel-header { padding: 16px 16px 12px; } }

        .form-panel-header .panel-icon { font-size: 22px; }

        .form-panel-header .panel-title {
            font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
            color: var(--text-primary); margin: 0;
        }

        .form-panel-body { padding: 24px; max-height: calc(100vh - 200px); overflow-y: auto; }

        @media (max-width: 600px) { .form-panel-body { padding: 16px; max-height: none; } }

        .form-panel-body::-webkit-scrollbar { width: 4px; }
        .form-panel-body::-webkit-scrollbar-track { background: transparent; }
        .form-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .section-block { margin-bottom: 28px; }

        .section-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .repeatable-block {
            border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 16px; margin-bottom: 10px; background: var(--bg-input);
        }

        .repeatable-block-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 12px;
        }

        .repeatable-block-index {
            font-size: 11px; font-weight: 600;
            color: var(--text-muted); font-family: 'DM Mono', monospace;
        }

        .field-group { margin-bottom: 14px; }
        .field-group:last-child { margin-bottom: 0; }

        .field-label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 5px; letter-spacing: 0.1px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        @media (max-width: 480px) { .field-label { font-size: 11px; white-space: normal; } }

        .field-label .optional-badge {
            font-size: 10px; font-weight: 400;
            color: var(--text-muted); margin-left: 5px; font-style: italic;
        }

        .field-input {
            width: 100%; padding: 9px 12px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary); background: white;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
            appearance: none; -webkit-appearance: none;
            font-size: max(13.5px, 16px);
        }

        @media (min-width: 600px) { .field-input { font-size: 13.5px; } }

        .field-input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
        .field-input::placeholder { color: var(--text-muted); }
        textarea.field-input { resize: vertical; min-height: 80px; line-height: 1.5; }

        /* =====================================================
           VALIDATION STATES
        ===================================================== */
        .field-input.is-valid { border-color: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.10); }
        .field-input.is-valid:focus { border-color: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
        .field-input.is-invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.10); }
        .field-input.is-invalid:focus { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }

        @keyframes validFlash {
            0%   { box-shadow: 0 0 0 4px rgba(16,185,129,0.35); }
            100% { box-shadow: 0 0 0 3px rgba(16,185,129,0.10); }
        }

        @keyframes invalidShake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-4px); }
            40%       { transform: translateX(4px); }
            60%       { transform: translateX(-3px); }
            80%       { transform: translateX(3px); }
        }

        .field-input.is-valid   { animation: validFlash   0.4s ease-out  forwards; }
        .field-input.is-invalid { animation: invalidShake 0.35s ease-out; }

        .field-error {
            display: flex; align-items: center; gap: 5px; margin-top: 5px;
            font-size: 11.5px; font-weight: 500; color: var(--danger); line-height: 1.4;
        }

        .field-error .error-icon { font-size: 12px; flex-shrink: 0; }

        .field-counter {
            display: flex; justify-content: flex-end; margin-top: 4px;
            font-size: 11px; font-family: 'DM Mono', monospace;
            color: var(--text-muted); transition: color 0.15s;
        }

        .field-counter.counter-warn { color: var(--warning); }
        .field-counter.counter-over { color: var(--danger); font-weight: 600; }

        /* =====================================================
           DATE FIELD
        ===================================================== */
        .date-field-wrapper { position: relative; display: flex; align-items: center; }

        .date-field-wrapper .field-input {
            flex: 1; border-radius: var(--radius-sm) 0 0 var(--radius-sm); border-right: none;
        }

        .date-field-wrapper .field-input:focus { z-index: 1; }

        .date-calendar-btn {
            display: flex; align-items: center; justify-content: center;
            width: 38px; min-height: 38px; background: var(--bg-input);
            border: 1px solid var(--border); border-left: none;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            cursor: pointer; font-size: 15px; transition: var(--transition); flex-shrink: 0;
        }

        .date-calendar-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

        .date-field-wrapper.date-valid .field-input { border-color: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.10); }
        .date-field-wrapper.date-valid .date-calendar-btn { border-color: var(--success); }
        .date-field-wrapper.date-invalid .field-input { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.10); }
        .date-field-wrapper.date-invalid .date-calendar-btn { border-color: var(--danger); }

        .date-native-picker {
            position: absolute; right: 0; top: 100%;
            width: 0; height: 0; opacity: 0; pointer-events: none; border: none; padding: 0;
        }

        /* =====================================================
           DATE RANGE FIELD
        ===================================================== */
        .daterange-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .daterange-row { display: flex; align-items: center; gap: 8px; }
        .daterange-row .date-field-wrapper { flex: 1; min-width: 0; }

        @media (max-width: 480px) {
            .daterange-row { flex-wrap: wrap; gap: 6px; }
            .daterange-row .date-field-wrapper { flex: 1 1 calc(50% - 20px); min-width: 120px; }
        }

        .daterange-separator { font-size: 12px; color: var(--text-muted); font-weight: 500; flex-shrink: 0; padding: 0 2px; }

        .btn-present {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 7px 11px;
            font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600;
            letter-spacing: 0.2px; color: var(--text-secondary);
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
            white-space: nowrap; flex-shrink: 0;
        }

        .btn-present:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .btn-present.is-active { color: white; background: var(--accent); border-color: var(--accent-dark); }
        .btn-present.is-active:hover { background: var(--accent-dark); }

        /* =====================================================
           IMAGE UPLOAD ZONE
        ===================================================== */
        .image-upload-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }

        .image-upload-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .image-upload-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .image-upload-zone { display: flex; align-items: center; gap: 16px; }

        .image-upload-trigger {
            position: relative; width: 80px; height: 80px; flex-shrink: 0;
            border-radius: 50%; overflow: hidden; cursor: pointer;
            border: 2px dashed var(--border); background: var(--bg-input);
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
            background-size: auto; background-position: center; background-repeat: no-repeat;
        }

        .image-upload-trigger.square { border-radius: var(--radius-md); }
        .image-upload-trigger:hover { border-color: var(--accent); }

        .image-upload-placeholder { display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; position: relative; z-index: 1; }
        .image-upload-placeholder .upload-icon { font-size: 22px; opacity: 0.4; }

        .image-upload-placeholder .upload-hint {
            font-size: 9px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted);
        }

        .image-upload-trigger .image-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.45);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 2px; opacity: 0; transition: opacity 0.2s; z-index: 2;
        }

        .image-upload-trigger:hover .image-overlay { opacity: 1; }
        .image-overlay .overlay-icon { font-size: 18px; }

        .image-overlay .overlay-text {
            font-size: 9px; font-weight: 600; color: white;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .image-upload-info { flex: 1; }
        .image-upload-info p { font-size: 12px; color: var(--text-secondary); margin: 0 0 8px 0; line-height: 1.5; }

        .btn-remove-image {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            color: var(--danger); background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }

        .btn-remove-image:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); }
        .image-file-input { display: none; }

        /* =====================================================
           BUTTONS
        ===================================================== */
        .btn-remove {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            color: var(--danger); background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }

        .btn-remove:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); }

        .btn-add {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            color: var(--accent); background: var(--accent-soft);
            border: 1.5px dashed rgba(59,130,246,0.35); border-radius: var(--radius-sm);

        ===================================================== */

        /* =====================================================
           ANIMATIONS
        ===================================================== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }

        }

        .animate-in { animation: fadeInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) both; }
        .animate-in:nth-child(1) { animation-delay: 0ms; }
        .animate-in:nth-child(2) { animation-delay: 60ms; }

/* ============================================================
   i18n CONTEXT + HOOK
   ─────────────────────────────────────────────────────────
   Every component calls useLang() to get t().
   t(key) resolves dot-notation: "ui.back" → LANGUAGES[lang].ui.back
   t(key, vars) replaces {placeholder} tokens in the string.
   Falls back to English if the key is missing in active lang.
============================================================ */

const LanguageContext = createContext(null);

function LanguageProvider({ children }) {
    const [lang, setLang] = useState("en");

    function t(key, vars) {
        const keys    = key.split(".");
        let   value   = LANGUAGES[lang];
        let   fallback = LANGUAGES["en"];

        for (const k of keys) {
            value    = value    && value[k];
            fallback = fallback && fallback[k];
        }

        const result = (typeof value === "string" ? value : null)
                    || (typeof fallback === "string" ? fallback : key);

        if (vars && typeof result === "string") {
            return Object.keys(vars).reduce(
                (s, v) => s.replace(`{${v}}`, vars[v]),
                result
            );
        }

        return result;
    }

    /* Convenience: get template-scoped translation
       tpl("resume", "fields.name.label") */
    function tpl(templateId, key) {
        return t(`templates.${templateId}.${key}`);
    }

    return (
        <LanguageContext.Provider value={{ lang, setLang, t, tpl }}>
            {children}
        </LanguageContext.Provider>
    );
}

function useLang() {
    return useContext(LanguageContext);
}

/* ============================================================
   LANGUAGE SWITCHER COMPONENT
============================================================ */

function LanguageSwitcher() {
    const { lang, setLang, t } = useLang();
    const [open, setOpen]      = useState(false);
    const wrapperRef           = useRef(null);

    /* Close dropdown when clicking outside */
    useEffect(() => {
        function handleClick(e) {
            if (wrapperRef.current && !wrapperRef.current.contains(e.target)) {
                setOpen(false);
            }
        }
        document.addEventListener("mousedown", handleClick);
        return () => document.removeEventListener("mousedown", handleClick);
    }, []);

    const current = LANGUAGES[lang].meta;
    const options = Object.entries(LANGUAGES);

    return (
        <div className="lang-switcher" ref={wrapperRef}>
            <button
                className="lang-trigger"
                onClick={() => setOpen(o => !o)}
                title="Change language"
            >
                <span className="lang-flag">{current.flag}</span>
                <span className="lang-code">{current.code}</span>
                <span className="lang-chevron">{open ? "▲" : "▼"}</span>
            </button>

            {open && (
                <div className="lang-dropdown">
                    {options.map(([code, data]) => (
                        <button
                            key={code}
                            className={"lang-option" + (lang === code ? " is-active" : "")}
                            onClick={() => { setLang(code); setOpen(false); }}
                        >
                            <span className="opt-flag">{data.meta.flag}</span>
                            <span className="opt-name">{data.meta.name}</span>
                            <span className="opt-check">✓</span>
                        </button>
                    ))}
                </div>
            )}
        </div>
    );
}

/* ============================================================
   CONSTANTS
============================================================ */

const MAX_TEXT            = 3000;
const MAX_NUMBER          = 1000000000;
const MAX_IMAGE_PX        = 1200;
const IMAGE_QUALITY       = 0.82;
const PREVIEW_DEBOUNCE_MS = 120;

/* ============================================================
   DEBOUNCE HOOK
============================================================ */

function useDebounced(value, delay) {
    const [debounced, setDebounced] = useState(value);
    useEffect(() => {
        const timer = setTimeout(() => setDebounced(value), delay);
        return () => clearTimeout(timer);
    }, [value, delay]);
    return debounced;
}

/* ============================================================
   VALIDATION ENGINE — uses t() for translated error messages
============================================================ */

function makeValidators(t) {
    return {
        text: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                if (v.length > MAX_TEXT) return t("errors.text_long", { max: MAX_TEXT.toLocaleString() });
                return null;
            }
        },
        textarea: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                if (v.length > MAX_TEXT) return t("errors.text_long", { max: MAX_TEXT.toLocaleString() });
                return null;
            }
        },
        email: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? null : t("errors.email");
            }
        },
        phone: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                return /^[+\d][\d\s\-().]{3,24}$/.test(v.trim()) ? null : t("errors.phone");
            }
        },
        number: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                const n = parseFloat(String(v).replace(/,/g, ""));
                if (isNaN(n))       return t("errors.number_invalid");
                if (n < 0)          return t("errors.number_negative");
                if (n > MAX_NUMBER) return t("errors.number_max");
                return null;
            }
        },
        date: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                const patterns = [
                    /^\d{2}\/\d{2}\/\d{4}$/,
                    /^\d{2}-\d{2}-\d{4}$/,
                    /^\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}$/
                ];
                return patterns.some(p => p.test(v.trim())) ? null : t("errors.date_format");
            }
        },
        year: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                const trimmed = v.trim();
                if (!/^\d{4}$/.test(trimmed)) return t("errors.year_format");
                const n = parseInt(trimmed, 10);
                if (n < 1900 || n > 2100)     return t("errors.year_range");
                return null;
            }
        },
        url: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                const ok = /^(https?:\/\/)?(www\.)?[\w\-]+(\.[\w\-]+)+(\/[\w\-._~:/?#[\]@!$&'()*+,;=%]*)?$/.test(v.trim());
                return ok ? null : t("errors.url");
            }
        },
        address: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                const trimmed = v.trim();
                if (trimmed.length < 5)   return t("errors.address_short");
                if (trimmed.length > 200) return t("errors.address_long");
                if (!/[a-zA-Z]/.test(trimmed) || !/\d/.test(trimmed)) return t("errors.address_format");
                return null;
            }
        },
        skill: {
            validate: (v, required) => {
                if (!v || !v.trim()) return required ? t("errors.required") : null;
                if (v.length > 60) return t("errors.skill_long");
                return null;
            }
        },
        daterange: {
            validate: (v, required) => {
                if (!v || typeof v !== "object") return required ? t("errors.required") : null;
                const { start, end, present } = v;
                if (!start || !start.trim()) return required ? t("errors.date_start_req") : null;
                const patterns = [
                    /^\d{2}\/\d{2}\/\d{4}$/,
                    /^\d{2}-\d{2}-\d{4}$/,
                    /^\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}$/
                ];
                if (!patterns.some(p => p.test(start.trim()))) return t("errors.date_start_fmt");
                if (present) return null;
                if (!end || !end.trim()) return t("errors.date_end_req");
                if (!patterns.some(p => p.test(end.trim())))   return t("errors.date_end_fmt");
                const startDate = parseDisplayDate(start);
                const endDate   = parseDisplayDate(end);
                if (startDate && endDate && endDate <= startDate) return t("errors.date_end_before");
                return null;
            }
        }
    };
}

function validateFieldWithT(field, value, t) {
    const validators = makeValidators(t);
    const key        = field.validate || field.type || "text";
    const validator  = validators[key];
    if (!validator) return null;
    return validator.validate(value, !field.optional);
}

/* ============================================================
   CROSS-FIELD VALIDATION
============================================================ */

function parseDisplayDate(str) {
    if (!str || !str.trim()) return null;
    const s = str.trim();
    const dmy = s.match(/^(\d{1,2})[\/\-](\d{2})[\/\-](\d{4})$/);
    if (dmy) return new Date(+dmy[3], +dmy[2] - 1, +dmy[1]);
    const months = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
    const named  = s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})$/);
    if (named) {
        const m = months[named[2].toLowerCase().slice(0, 3)];
        if (m !== undefined) return new Date(+named[3], m, +named[1]);
    }
    return null;
}

function validateCrossFieldsWithT(section, block, t) {
    const errors = [];
    section.fields.forEach(field => {
        if (!field.afterField) return;
        const thisVal  = block[field.name]      || "";
        const otherVal = block[field.afterField] || "";
        if (!thisVal || !thisVal.trim()) return;
        if (!otherVal || !otherVal.trim()) return;
        const thisDate  = parseDisplayDate(thisVal);
        const otherDate = parseDisplayDate(otherVal);
        if (!thisDate || !otherDate) return;
        if (thisDate <= otherDate) {
            const otherField = section.fields.find(f => f.name === field.afterField);
            const otherLabel = otherField ? otherField.tplLabel || otherField.name : field.afterField;
            errors.push({
                fieldName: field.name,
                error:     t("errors.date_after", { field: otherLabel })
            });
        }
    });
    return errors;
}

function getAllFieldErrors(template, documentData, t) {
    const errors = [];
    template.sections.forEach(section => {
        const blocks = Array.isArray(documentData[section.id])
            ? documentData[section.id]
            : [documentData[section.id]];
        blocks.forEach((block, idx) => {
            section.fields.forEach(field => {
                const val = block[field.name] !== undefined ? block[field.name] : "";
                const err = validateFieldWithT(field, val, t);
                if (err) errors.push({ sectionId: section.id, blockIndex: idx, fieldName: field.name });
            });
            validateCrossFieldsWithT(section, block, t).forEach(({ fieldName }) => {
                errors.push({ sectionId: section.id, blockIndex: idx, fieldName });
            });
        });
    });
    return errors;
}

/* ============================================================
   DATE RANGE DISPLAY HELPER
============================================================ */

function formatDateRange(v, presentLabel) {
    if (!v || typeof v !== "object") return "";
    const { start, end, present } = v;
    if (!start) return "";
    if (present) return `${start} – ${presentLabel || "Present"}`;
    if (end)     return `${start} – ${end}`;
    return start;
}

/* ============================================================
   INVOICE HELPERS
============================================================ */

function parseNumber(val) {
    const n = parseFloat(String(val).replace(/[^0-9.]/g, ""));
    return isNaN(n) ? 0 : n;
}

function calcInvoiceTotals(items, taxRate) {
    const subtotal  = items.reduce((s, r) => s + parseNumber(r.qty) * parseNumber(r.price), 0);
    const taxAmount = subtotal * (parseNumber(taxRate) / 100);
    return { subtotal, taxAmount, total: subtotal + taxAmount };
}

function formatMoney(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function initSection(section) {
    const obj = {};
    section.fields.forEach(f => {
        obj[f.name] = f.validate === "daterange"
            ? { start: "", end: "", present: false }
            : "";

}

function initDocument(template) {
    const data = {};

        data[section.id] = section.repeatable
            ? [initSection(section)]
            : initSection(section);
    });
    return data;
}

/* ============================================================
   IMAGE HELPERS — compression on upload
============================================================ */

function compressImage(file) {
    return new Promise((resolve, reject) => {
        const reader   = new FileReader();
        reader.onerror = () => reject(new Error("Could not read image"));
        reader.onload  = e => {
            const img   = new Image();
            img.onerror = () => reject(new Error("Could not decode image"));
            img.onload  = () => {
                const { width, height } = img;
                let targetW = width;
                let targetH = height;

                if (width > MAX_IMAGE_PX || height > MAX_IMAGE_PX) {
                    if (width >= height) {
                        targetW = MAX_IMAGE_PX;
                        targetH = Math.round(height * (MAX_IMAGE_PX / width));
                    } else {
                        targetH = MAX_IMAGE_PX;
                        targetW = Math.round(width  * (MAX_IMAGE_PX / height));
                    }
                }

                const canvas    = document.createElement("canvas");
                canvas.width    = targetW;
                canvas.height   = targetH;
                const ctx       = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, targetW, targetH);
                resolve(canvas.toDataURL("image/jpeg", IMAGE_QUALITY));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

/* ============================================================
   PDF EXPORT — adaptive quality
============================================================ */

function getPDFScale() {
    const isMobile = window.innerWidth <= 768 ||
        (navigator.maxTouchPoints > 0 && window.innerWidth < 1024);
    return isMobile ? 2 : 3;
}

async function exportPreviewToPDF(previewDocRef, filename) {
    const node = previewDocRef.current;
    if (!node) return;

    const prevShadow = node.style.boxShadow;
    const prevMargin = node.style.margin;
    const prevRadius = node.style.borderRadius;
    node.style.boxShadow    = "none";
    node.style.margin       = "0";
    node.style.borderRadius = "0";

    const canvas = await window.html2canvas(node, {
        scale:           getPDFScale(),
        useCORS:         true,
        allowTaint:      true,
        backgroundColor: "#ffffff",
        logging:         false,
        removeContainer: true,
        windowWidth:     1400,
        imageTimeout:    0
    });

    node.style.boxShadow    = prevShadow;
    node.style.margin       = prevMargin;
    node.style.borderRadius = prevRadius;

    const A4_W     = 210;
    const A4_H     = 297;
    const canvasW  = canvas.width;
    const canvasH  = canvas.height;
    const pxPerMm  = canvasW / A4_W;
    const pageH_px = A4_H * pxPerMm;
    const pages    = Math.ceil(canvasH / pageH_px);
    const pdf      = new jsPDF("p", "mm", "a4");

    for (let p = 0; p < pages; p++) {
        if (p > 0) pdf.addPage();
        const sliceY     = p * pageH_px;
        const sliceH     = Math.min(pageH_px, canvasH - sliceY);
        const pageCanvas = document.createElement("canvas");
        pageCanvas.width  = canvasW;
        pageCanvas.height = sliceH;
        const ctx         = pageCanvas.getContext("2d");
        ctx.drawImage(canvas, 0, sliceY, canvasW, sliceH, 0, 0, canvasW, sliceH);
        const imgData   = pageCanvas.toDataURL("image/png");
        const sliceH_mm = sliceH / pxPerMm;
        pdf.addImage(imgData, "PNG", 0, 0, A4_W, sliceH_mm);
    }

    pdf.save(filename);
}

/* ============================================================
   SAVE / LOAD
============================================================ */

function saveProgressToFile(template, documentData, extrasState, uploadedImage) {
    const payload = {
        easydocVersion: "2.1",
        templateId:     template.id,
        documentData,
        extrasState,
        uploadedImage:  uploadedImage || null
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = "easydoc-" + template.id + "-progress.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function loadProgressFromFile() {
    return new Promise((resolve, reject) => {
        const input    = document.createElement("input");
        input.type     = "file";
        input.accept   = ".json,application/json";
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) { reject(new Error("No file selected")); return; }
            const reader   = new FileReader();
            reader.onload  = evt => {
                try { resolve(JSON.parse(evt.target.result)); }
                catch { reject(new Error("parse_error")); }
            };
            reader.onerror = () => reject(new Error("read_error"));
            reader.readAsText(file);
        };
        document.body.appendChild(input);
        input.click();
        document.body.removeChild(input);
    });
}

/* ============================================================
   UNIVERSAL PREVIEW
   Debounced + language-aware.
   Passes t() into layoutFn so all preview text is translated.
============================================================ */

function UniversalPreview({ template, documentData, extrasState, uploadedImage, previewDocRef }) {
    const { t }               = useLang();
    const debouncedData       = useDebounced(documentData, PREVIEW_DEBOUNCE_MS);
    const debouncedExtras     = useDebounced(extrasState,  PREVIEW_DEBOUNCE_MS);

    if (!template) return null;

    const blocks = template.layoutFn
        ? template.layoutFn({
            documentData: debouncedData,
            extrasState:  debouncedExtras,
            uploadedImage,
            t
          })
        : [];

    const hasContent = blocks.some(b => b.hasContent !== false);

    if (!hasContent) {
        const tplName = t(`templates.${template.id}.name`).toLowerCase();
        return (
            <div className="empty-preview" ref={previewDocRef}>
                <div className="empty-icon">{template.icon}</div>
                <p>
                    {t("ui.fill_form")} {tplName}
                    {t("ui.fill_form2") ? ` ${t("ui.fill_form2")}` : ""}
                </p>
            </div>
        );
    }

    return (
        <div className="preview-doc" ref={previewDocRef}>
            {blocks.map((block, i) => {
                if (block.hasContent === false) return null;

                switch (block.type) {

                    case "header":
                        return (
                            <DocHeader
                                key={i}
                                title={block.title}
                                subtitle={block.subtitle}
                                metaItems={block.metaItems}
                                rightPanel={block.rightPanel}
                                image={block.image}
                            />
                        );

                    case "twoColumn":
                        return <DocTwoColumn key={i} columns={block.columns} />;

                    case "entryList":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocEntryList entries={block.entries} />
                            </DocSection>
                        );

                    case "tagList":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocTagList tags={block.tags} />
                            </DocSection>
                        );

                    case "table":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocTable columns={block.columns} rows={block.rows} />
                            </DocSection>
                        );

                    case "totals":
                        return <DocTotals key={i} rows={block.rows} />;

                    case "textBlock":
                        return (
                            <DocSection key={i} title={block.title}>
                                <DocTextBlock text={block.text} />
                            </DocSection>
                        );

                    case "note":
                        return <DocNote key={i} text={block.text} />;

                    default:
                        return null;
                }
            })}
        </div>
    );
}

/* ============================================================
   UNIVERSAL IMAGE UPLOAD ZONE
============================================================ */

function ImageUploadZone({ imageConfig, uploadedImage, onImageChange }) {
    const { t }        = useLang();
    const fileInputRef = useRef(null);
    if (!imageConfig) return null;
    const isCircle = imageConfig.shape === "circle";

    async function handleFileChange(e) {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        try {
            const compressed = await compressImage(file);
            onImageChange(compressed);
        } catch { /* silently ignore */ }
        e.target.value = "";
    }

    function handleRemove(e) {
        e.stopPropagation();
        onImageChange(null);
    }

    const triggerStyle = uploadedImage
        ? {
            backgroundImage:    `url(${uploadedImage})`,
            backgroundSize:     "auto",
            backgroundPosition: "center",
            backgroundRepeat:   "no-repeat"
          }
        : {};

    return (
        <div className="image-upload-section">
            <div className="image-upload-label">{imageConfig.label}</div>
            <div className="image-upload-zone">
                <div
                    className={isCircle ? "image-upload-trigger" : "image-upload-trigger square"}
                    style={triggerStyle}
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    title={uploadedImage ? t("ui.change") : t("ui.upload")}
                >
                    {uploadedImage ? (
                        <div className="image-overlay">
                            <span className="overlay-icon">✏️</span>
                            <span className="overlay-text">{t("ui.change")}</span>
                        </div>
                    ) : (
                        <div className="image-upload-placeholder">
                            <span className="upload-icon">{imageConfig.icon}</span>
                            <span className="upload-hint">{t("ui.upload")}</span>
                        </div>
                    )}
                </div>
                <div className="image-upload-info">
                    <p>{t("ui.image_hint")}<br />{t("ui.image_hint2")}</p>
                    {uploadedImage && (
                        <button className="btn-remove-image" onClick={handleRemove}>
                            {t("ui.remove_image")}
                        </button>
                    )}
                </div>
                <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                    className="image-file-input"
                    onChange={handleFileChange}
                />
            </div>
        </div>
    );
}
