function App() {
    const [stage,          setStage]          = useState("home");
    const [template,       setTemplate]       = useState(null);
    const [documentData,   setDocumentData]   = useState({});
    const [taxRate,        setTaxRate]        = useState("0");
    const [search,         setSearch]         = useState("");
    const [forceShowErrors, setForceShowErrors] = useState(false);
    const [loadError,      setLoadError]      = useState("");

    const formPanelBodyRef = useRef(null);
    const loadInputRef     = useRef(null);

    function selectTemplate(tpl) {
        setTemplate(tpl);
        setDocumentData(initDocument(tpl));
        setTaxRate("0");
        setForceShowErrors(false);
        setLoadError("");
        setStage("edit");
    }

    function updateField(sectionId, index, fieldName, value) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (Array.isArray(copy[sectionId])) {
                copy[sectionId][index][fieldName] = value;
            } else {
                copy[sectionId][fieldName] = value;
            }
            return copy;
        });
    }

    function addBlock(section) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            copy[section.id].push(initSection(section));
            return copy;
        });
    }

    function removeBlock(section, index) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (copy[section.id].length > 1) {
                copy[section.id].splice(index, 1);
            }
            return copy;
        });
    }

    /* ── DOWNLOAD GUARD ──
       1. Check all fields for errors.
       2. If any errors exist, force-show them all and scroll to the first one.
       3. Only proceed to PDF export when everything is clean. */
    function handleExportPDF() {
        const errors = getAllFieldErrors(template, documentData);

        if (errors.length > 0) {
            /* Reveal all error messages at once */
            setForceShowErrors(true);

            /* Scroll to the first invalid input inside the form panel body */
            requestAnimationFrame(() => {
                const panel = formPanelBodyRef.current;
                if (!panel) return;

                /* Look for the first element carrying is-invalid inside the panel */
                const firstInvalid = panel.querySelector(".is-invalid");
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
                    firstInvalid.focus({ preventScroll: true });
                }
            });
            return;
        }

        /* All fields clean — proceed */
        exportPDF(template, documentData, taxRate);
    }

    /* ── SAVE PROGRESS ── */
    function handleSave() {
        saveProgressToFile(template, documentData, taxRate);
    }

    /* ── LOAD PROGRESS ── */
    async function handleLoad() {
        setLoadError("");
        try {
            const payload = await loadProgressFromFile();

            /* Validate the file shape */
            if (!payload.templateId || !payload.documentData) {
                setLoadError("This file doesn't look like an EasyDoc save file.");
                return;
            }

            /* Find the matching template */
            const tpl = TEMPLATES.find(t => t.id === payload.templateId);
            if (!tpl) {
                setLoadError("The template in this save file is not available.");
                return;
            }

            /* Restore state */
            setTemplate(tpl);
            setDocumentData(payload.documentData);
            setTaxRate(payload.taxRate || "0");
            setForceShowErrors(false);
            setLoadError("");
            setStage("edit");

        } catch (err) {
            setLoadError(err.message || "Could not load the file.");
        }
    }

    /* Featured — hardcoded, never affected by search */
    const featuredTemplates = TEMPLATES.filter(tpl => FEATURED_IDS.includes(tpl.id));

    /* All templates — filtered only by search */
    const filteredTemplates = TEMPLATES.filter(tpl =>
        tpl.name.toLowerCase().includes(search.toLowerCase()) ||
        tpl.description.toLowerCase().includes(search.toLowerCase()) ||
        tpl.category.toLowerCase().includes(search.toLowerCase())
    );

    return (
        <div style={{ minHeight: "100vh" }}>

            {/* ================================================
                HEADER
            ================================================ */}
            <header className="app-header">
                <div className="header-inner">
                    <div className="app-logo">
                        <div className="logo-mark">E</div>
                        <span className="logo-text">EasyDoc</span>
                    </div>
                    {stage === "edit" && (
                        <button
                            className="btn-back"
                            onClick={() => setStage("home")}
                        >
                            ← Back
                        </button>
                    )}
                </div>
            </header>

            {/* ================================================
                HOME SCREEN
            ================================================ */}
            {stage === "home" && (
                <div className="home-wrapper">

                    <div className="home-heading">
                        <h2>What would you like to create?</h2>
                        <p>Choose a template and build a professional document in minutes</p>
                    </div>

                    {/* ── FEATURED — never touched by search ── */}
                    <div className="home-section-heading">
                        <h3>⭐ Featured</h3>
                        <div className="section-rule"></div>
                    </div>

                    <div className="template-grid" style={{ marginBottom: "0" }}>
                        {featuredTemplates.map((tpl, i) => (
                            <button
                                key={tpl.id}
                                className="template-card animate-in"
                                style={{ animationDelay: (i * 70) + "ms" }}
                                onClick={() => selectTemplate(tpl)}
                            >
                                <span className="card-icon">{tpl.icon}</span>
                                <div className="card-category">{tpl.category}</div>
                                <div className="card-name">{tpl.name}</div>
                                <div className="card-desc">{tpl.description}</div>
                            </button>
                        ))}
                    </div>

                    {/* ── DIVIDER ── */}
                    <hr className="home-divider" />

                    {/* ── ALL DOCUMENTS — search only affects this ── */}
                    <div className="search-bar-wrapper">
                        <span className="search-icon">🔍</span>
                        <input
                            className="search-bar-input"
                            type="text"
                            placeholder="Search all templates..."
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                        />
                    </div>

                    <div className="all-docs-header">
                        <div className="home-section-heading" style={{ marginBottom: "0" }}>
                            <h3>All Documents</h3>
                            <div className="section-rule"></div>
                        </div>
                        <span className="all-docs-count">
                            {filteredTemplates.length} template{filteredTemplates.length !== 1 ? "s" : ""}
                        </span>
                    </div>

                    {filteredTemplates.length > 0 ? (
                        <div className="template-grid">
                            {filteredTemplates.map((tpl, i) => (
                                <button
                                    key={tpl.id}
                                    className="template-card animate-in"
                                    style={{ animationDelay: (i * 70) + "ms" }}
                                    onClick={() => selectTemplate(tpl)}
                                >
                                    <span className="card-icon">{tpl.icon}</span>
                                    <div className="card-category">{tpl.category}</div>
                                    <div className="card-name">{tpl.name}</div>
                                    <div className="card-desc">{tpl.description}</div>
                                </button>
                            ))}
                        </div>
                    ) : (
                        <div className="no-results">
                            <span className="no-results-icon">🔍</span>
                            <p>No templates found for "<strong>{search}</strong>"</p>
                        </div>
                    )}

                </div>
            )}

            {/* ================================================
                EDITOR SCREEN
            ================================================ */}
            {stage === "edit" && template && (
                <div className="editor-wrapper">
                    <div className="editor-grid">

                        {/* ---- FORM PANEL ---- */}
                        <div className="form-panel animate-in">

                            <div className="form-panel-header">
                                <span className="panel-icon">{template.icon}</span>
                                <h2 className="panel-title">{template.name}</h2>
                            </div>

                            <div className="form-panel-body" ref={formPanelBodyRef}>

                                {template.sections.map(section => (
                                    <div key={section.id} className="section-block">

                                        <div className="section-label">
                                            {section.title}
                                        </div>

                                        {(Array.isArray(documentData[section.id])
                                            ? documentData[section.id]
                                            : [documentData[section.id]]
                                        ).map((block, idx) => (
                                            <div
                                                key={idx}
                                                className={section.repeatable ? "repeatable-block" : ""}
                                            >
                                                {section.repeatable && (
                                                    <div className="repeatable-block-header">
                                                        <span className="repeatable-block-index">
                                                            #{String(idx + 1).padStart(2, "0")}
                                                        </span>
                                                        {documentData[section.id].length > 1 && (
                                                            <button
                                                                className="btn-remove"
                                                                onClick={() => removeBlock(section, idx)}
                                                            >
                                                                ✕ Remove
                                                            </button>
                                                        )}
                                                    </div>
                                                )}

                                                {section.fields.map(field => (
                                                    <div key={field.name} className="field-group">
                                                        <label className="field-label">
                                                            {field.label}
                                                        </label>
                                                        <SmartField
                                                            field={field}
                                                            value={block[field.name]}
                                                            forceShowError={forceShowErrors}
                                                            onChange={val =>
                                                                updateField(
                                                                    section.id,
                                                                    idx,
                                                                    field.name,
                                                                    val
                                                                )
                                                            }
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        ))}

                                        {section.repeatable && (
                                            <button
                                                className="btn-add"
                                                onClick={() => addBlock(section)}
                                            >
                                                + Add {section.title}
                                            </button>
                                        )}
                                    </div>
                                ))}

                                {/* Tax rate — invoice only */}
                                {template.id === "invoice" && (
                                    <div className="tax-row">
                                        <label>Tax Rate</label>
                                        <input
                                            type="number"
                                            min="0"
                                            max="100"
                                            step="0.5"
                                            value={taxRate}
                                            onChange={e => setTaxRate(e.target.value)}
                                            placeholder="0"
                                        />
                                        <span className="tax-hint">% (leave 0 for no tax)</span>
                                    </div>
                                )}

                            </div>

                            {/* ---- FOOTER: Save / Load / Download ---- */}
                            <div className="form-panel-footer">

                                {/* Save + Load row */}
                                <div className="footer-saveload-row">
                                    <button
                                        className="btn-save"
                                        onClick={handleSave}
                                        title="Save your progress as a file"
                                    >
                                        💾 Save Progress
                                    </button>
                                    <button
                                        className="btn-load"
                                        onClick={handleLoad}
                                        title="Load a previously saved progress file"
                                    >
                                        📂 Load Progress
                                    </button>
                                </div>

                                {/* Load error message */}
                                {loadError && (
                                    <div className="field-error" style={{ marginTop: "2px" }}>
                                        <span className="error-icon">⚠</span>
                                        {loadError}
                                    </div>
                                )}

                                {/* Download PDF button */}
                                <button
                                    className="btn-download"
                                    onClick={handleExportPDF}
                                >
                                    ↓ Download PDF
                                </button>

                            </div>

                        </div>

                        {/* ---- PREVIEW PANEL ---- */}
                        <div className="preview-panel animate-in" style={{ animationDelay: "80ms" }}>

                            <div className="preview-panel-header">
                                <span className="preview-label">Live Preview</span>
                                <span className="preview-live-dot">Live</span>
                            </div>

                            <div className="preview-scroll-area">
                                <Preview
                                    template={template}
                                    data={documentData}
                                    taxRate={taxRate}
                                />
                            </div>

                        </div>

                    </div>
                </div>
            )}

        </div>
    );
}

/* ============================================================
   MOUNT
============================================================ */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
