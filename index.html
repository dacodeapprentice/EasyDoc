<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyDoc — Document Generator</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --navy:           #0f172a;
            --navy-mid:       #1e293b;
            --navy-light:     #334155;
            --accent:         #3b82f6;
            --accent-dark:    #2563eb;
            --accent-soft:    #eff6ff;
            --success:        #10b981;
            --danger:         #ef4444;
            --warning:        #f59e0b;
            --text-primary:   #0f172a;
            --text-secondary: #64748b;
            --text-muted:     #94a3b8;
            --border:         #e2e8f0;
            --border-focus:   #3b82f6;
            --bg-page:        #f8fafc;
            --bg-card:        #ffffff;
            --bg-input:       #f8fafc;
            --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md:  0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg:  0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
            --radius-sm:  6px;
            --radius-md:  10px;
            --radius-lg:  16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* =====================================================
           APP HEADER
        ===================================================== */
        .app-header {
            background: var(--navy);
            border-bottom: 1px solid var(--navy-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-logo { display: flex; align-items: center; gap: 10px; }

        .app-logo .logo-mark {
            width: 30px; height: 30px;
            background: var(--accent);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; color: white;
            letter-spacing: -0.5px; flex-shrink: 0;
        }

        .app-logo .logo-text {
            font-size: 17px; font-weight: 700;
            color: white; letter-spacing: -0.3px;
        }

        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            color: rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
        }

        .btn-back:hover {
            color: white; background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.22);
        }

        /* =====================================================
           HOME SCREEN
        ===================================================== */
        .home-wrapper { max-width: 1100px; margin: 0 auto; padding: 60px 24px 80px; }
        .home-heading { text-align: center; margin-bottom: 48px; }

        .home-heading h2 {
            font-size: 32px; font-weight: 700; letter-spacing: -0.6px;
            color: var(--text-primary); margin-bottom: 10px;
        }

        .home-heading p { font-size: 16px; color: var(--text-secondary); margin: 0; }

        .home-section-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

        .home-section-heading h3 {
            font-size: 13px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-muted); margin: 0; white-space: nowrap;
        }

        .home-section-heading .section-rule { flex: 1; height: 1px; background: var(--border); }
        .home-divider { border: none; border-top: 1px solid var(--border); margin: 48px 0; }

        .search-bar-wrapper { position: relative; margin-bottom: 28px; }

        .search-bar-wrapper .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px; pointer-events: none;
        }

        .search-bar-input {
            width: 100%; padding: 10px 14px 10px 40px;
            font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text-primary);
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: var(--radius-md); outline: none;
            transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow-sm);
        }

        .search-bar-input:focus {
            border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .search-bar-input::placeholder { color: var(--text-muted); }

        .all-docs-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 20px;
        }

        .all-docs-count {
            font-size: 12px; font-weight: 500;
            color: var(--text-muted); font-family: 'DM Mono', monospace;
        }

        .no-results { text-align: center; padding: 52px 20px; color: var(--text-muted); }
        .no-results .no-results-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; display: block; }
        .no-results p { font-size: 14px; margin: 0; }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .template-card {
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: var(--radius-lg); padding: 28px 24px;
            cursor: pointer; text-align: left; width: 100%;
            font-family: 'DM Sans', sans-serif; transition: var(--transition);
            box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
        }

        .template-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .template-card:hover {
            border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-3px);
        }

        .template-card:hover::before { transform: scaleX(1); }
        .template-card .card-icon { font-size: 30px; margin-bottom: 16px; display: block; }

        .template-card .card-category {
            font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
        }

        .template-card .card-name {
            font-size: 18px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 6px; letter-spacing: -0.2px;
        }

        .template-card .card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        /* =====================================================
           EDITOR LAYOUT
        ===================================================== */
        .editor-wrapper { max-width: 1200px; margin: 0 auto; padding: 32px 24px 60px; }

        .editor-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 28px; align-items: start;
        }

        @media (max-width: 900px) { .editor-grid { grid-template-columns: 1fr; } }

        /* =====================================================
           FORM PANEL
        ===================================================== */
        .form-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden;
        }

        .form-panel-header {
            padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }

        .form-panel-header .panel-icon { font-size: 22px; }

        .form-panel-header .panel-title {
            font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
            color: var(--text-primary); margin: 0;
        }

        .form-panel-body { padding: 24px; max-height: calc(100vh - 200px); overflow-y: auto; }
        .form-panel-body::-webkit-scrollbar { width: 4px; }
        .form-panel-body::-webkit-scrollbar-track { background: transparent; }
        .form-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .section-block { margin-bottom: 28px; }

        .section-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .repeatable-block {
            border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 16px; margin-bottom: 10px; background: var(--bg-input);
        }

        .repeatable-block-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 12px;
        }

        .repeatable-block-index {
            font-size: 11px; font-weight: 600;
            color: var(--text-muted); font-family: 'DM Mono', monospace;
        }

        .field-group { margin-bottom: 14px; }
        .field-group:last-child { margin-bottom: 0; }

        .field-label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 5px; letter-spacing: 0.1px;
        }

        .field-label .optional-badge {
            font-size: 10px; font-weight: 400;
            color: var(--text-muted); margin-left: 5px; font-style: italic;
        }

        .field-input {
            width: 100%; padding: 9px 12px;
            font-family: 'DM Sans', sans-serif; font-size: 13.5px;
            color: var(--text-primary); background: white;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
            appearance: none; -webkit-appearance: none;
        }

        .field-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .field-input::placeholder { color: var(--text-muted); }
        textarea.field-input { resize: vertical; min-height: 80px; line-height: 1.5; }

        /* =====================================================
           VALIDATION STATES
        ===================================================== */
        .field-input.is-valid {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.10);
        }

        .field-input.is-valid:focus {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.18);
        }

        .field-input.is-invalid {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.10);
        }

        .field-input.is-invalid:focus {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.18);
        }

        .field-error {
            display: flex; align-items: center; gap: 5px; margin-top: 5px;
            font-size: 11.5px; font-weight: 500; color: var(--danger); line-height: 1.4;
        }

        .field-error .error-icon { font-size: 12px; flex-shrink: 0; }

        .field-counter {
            display: flex; justify-content: flex-end; margin-top: 4px;
            font-size: 11px; font-family: 'DM Mono', monospace;
            color: var(--text-muted); transition: color 0.15s;
        }

        .field-counter.counter-warn { color: var(--warning); }
        .field-counter.counter-over { color: var(--danger); font-weight: 600; }

        /* =====================================================
           DATE FIELD — universal calendar picker
        ===================================================== */
        .date-field-wrapper { position: relative; display: flex; align-items: center; }

        .date-field-wrapper .field-input {
            flex: 1;
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
            border-right: none;
        }

        .date-field-wrapper .field-input:focus { z-index: 1; }

        .date-calendar-btn {
            display: flex; align-items: center; justify-content: center;
            width: 38px; min-height: 38px; background: var(--bg-input);
            border: 1px solid var(--border); border-left: none;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            cursor: pointer; font-size: 15px; transition: var(--transition); flex-shrink: 0;
        }

        .date-calendar-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

        .date-field-wrapper.date-valid .field-input {
            border-color: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,0.10);
        }

        .date-field-wrapper.date-valid .date-calendar-btn { border-color: var(--success); }

        .date-field-wrapper.date-invalid .field-input {
            border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.10);
        }

        .date-field-wrapper.date-invalid .date-calendar-btn { border-color: var(--danger); }

        .date-native-picker {
            position: absolute; right: 0; top: 100%;
            width: 0; height: 0; opacity: 0; pointer-events: none; border: none; padding: 0;
        }

        /* =====================================================
           DATE RANGE FIELD — start + end with Present toggle
           Used by the experience period in resume.
           validate: "daterange" triggers this layout in SmartField.
        ===================================================== */
        .daterange-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .daterange-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .daterange-row .date-field-wrapper {
            flex: 1;
            min-width: 0;
        }

        .daterange-separator {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
            padding: 0 2px;
        }

        .btn-present {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 11px;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: var(--text-secondary);
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-present:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .btn-present.is-active {
            color: white;
            background: var(--accent);
            border-color: var(--accent-dark);
        }

        .btn-present.is-active:hover {
            background: var(--accent-dark);
        }

        /* =====================================================
           IMAGE UPLOAD ZONE — universal
        ===================================================== */
        .image-upload-section {
            margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }

        .image-upload-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .image-upload-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .image-upload-zone { display: flex; align-items: center; gap: 16px; }

        .image-upload-trigger {
            position: relative; width: 80px; height: 80px; flex-shrink: 0;
            border-radius: 50%; overflow: hidden; cursor: pointer;
            border: 2px dashed var(--border); background: var(--bg-input);
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
        }

        .image-upload-trigger.square { border-radius: var(--radius-md); }
        .image-upload-trigger:hover { border-color: var(--accent); background: var(--accent-soft); }

        .image-upload-placeholder {
            display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none;
        }

        .image-upload-placeholder .upload-icon { font-size: 22px; opacity: 0.4; }

        .image-upload-placeholder .upload-hint {
            font-size: 9px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted);
        }

        .image-upload-trigger img {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        }

        .image-upload-trigger .image-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.45);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 2px; opacity: 0; transition: opacity 0.2s;
        }

        .image-upload-trigger:hover .image-overlay { opacity: 1; }
        .image-overlay .overlay-icon { font-size: 18px; }

        .image-overlay .overlay-text {
            font-size: 9px; font-weight: 600; color: white;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .image-upload-info { flex: 1; }

        .image-upload-info p {
            font-size: 12px; color: var(--text-secondary); margin: 0 0 8px 0; line-height: 1.5;
        }

        .btn-remove-image {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            color: var(--danger); background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }

        .btn-remove-image:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); }
        .image-file-input { display: none; }

        /* =====================================================
           BUTTONS
        ===================================================== */
        .btn-remove {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
            font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
            color: var(--danger); background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.15); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }

        .btn-remove:hover { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); }

        .btn-add {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
            color: var(--accent); background: var(--accent-soft);
            border: 1.5px dashed rgba(59,130,246,0.35); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
            width: 100%; justify-content: center; margin-top: 4px;
        }

        .btn-add:hover { background: #dbeafe; border-color: var(--accent); }

        .form-panel-footer {
            padding: 16px 24px; border-top: 1px solid var(--border);
            background: var(--bg-input); display: flex; flex-direction: column; gap: 10px;
        }

        .footer-saveload-row { display: flex; gap: 8px; }

        .btn-secondary {
            flex: 1; display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 9px 14px; font-family: 'DM Sans', sans-serif;
            font-size: 13px; font-weight: 500; color: var(--text-secondary);
            background: white; border: 1px solid var(--border);
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
        }

        .btn-secondary:hover {
            color: var(--text-primary); border-color: var(--navy-light); box-shadow: var(--shadow-sm);
        }

        .btn-download {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px 20px;
            font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
            color: white; background: var(--accent); border: none;
            border-radius: var(--radius-md); cursor: pointer;
            transition: var(--transition); letter-spacing: 0.1px;
        }

        .btn-download:hover {
            background: var(--accent-dark);
            box-shadow: 0 4px 14px rgba(59,130,246,0.4); transform: translateY(-1px);
        }

        .btn-download:active { transform: translateY(0); }

        .btn-download:disabled {
            background: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none;
        }

        /* =====================================================
           PREVIEW PANEL
        ===================================================== */
        .preview-panel {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
            overflow: hidden; position: sticky; top: 78px;
        }

        .preview-panel-header {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .preview-panel-header .preview-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
            text-transform: uppercase; color: var(--text-muted);
        }

        .preview-live-dot {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 500; color: var(--success);
        }

        .preview-live-dot::before {
            content: ''; width: 6px; height: 6px; background: var(--success);
            border-radius: 50%; animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.85); }
        }

        .preview-scroll-area {
            max-height: calc(100vh - 250px); overflow-y: auto;
            overflow-x: hidden; background: #f1f5f9;
        }

        .preview-scroll-area::-webkit-scrollbar { width: 4px; }
        .preview-scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* =====================================================
           PREVIEW DOCUMENT — source of truth for PDF export
        ===================================================== */
        .preview-doc {
            background: white; margin: 20px; border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg); padding: 36px 36px 44px;
            min-height: 400px; font-size: 11.5px; line-height: 1.65;
            color: #1e293b; font-family: 'DM Sans', sans-serif;
        }

        /* Resume */
        .preview-doc .resume-header-row {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 20px; padding-bottom: 14px; border-bottom: 2px solid var(--navy);
            margin-bottom: 18px;
        }

        .preview-doc .resume-header-text { flex: 1; min-width: 0; }

<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
const { jsPDF } = window.jspdf;

/* ============================================================
   UNIVERSAL VALIDATION ENGINE
============================================================ */

const MAX_TEXT   = 3000;
const MAX_NUMBER = 1000000000;

function validateTextLike(v, required) {
    if (!v || !v.trim()) return required ? "This field is required" : null;
    if (v.length > MAX_TEXT) return `Maximum ${MAX_TEXT.toLocaleString()} characters allowed`;
    return null;
}

const VALIDATORS = {

    text:     { validate: (v, required) => validateTextLike(v, required) },
    textarea: { validate: (v, required) => validateTextLike(v, required) },

    email: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
            return ok ? null : "Please enter a valid email address (e.g. name@domain.com)";
        }
    },

    phone: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const ok = /^[+\d][\d\s\-().]{3,24}$/.test(v.trim());
            return ok ? null : "Phone can only contain digits, spaces, +, -, ( )";
        }
    },

    number: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const n = parseFloat(String(v).replace(/,/g, ""));
            if (isNaN(n))       return "Please enter a valid number (e.g. 150.00)";
            if (n < 0)          return "Number cannot be negative";
            if (n > MAX_NUMBER) return "Number cannot exceed 1,000,000,000";
            return null;
        }
    },

    date: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const trimmed  = v.trim();
            const patterns = [
                /^\d{2}\/\d{2}\/\d{4}$/,
                /^\d{2}-\d{2}-\d{4}$/,
                /^\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}$/
            ];
            if (!patterns.some(p => p.test(trimmed)))
                return "Use DD/MM/YYYY, DD-MM-YYYY or e.g. 23 Feb 2026";
            return null;
        }
    },

    year: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const trimmed = v.trim();
            if (!/^\d{4}$/.test(trimmed)) return "Please enter a 4-digit year (e.g. 2019)";
            const n = parseInt(trimmed, 10);
            if (n < 1900 || n > 2100) return "Year must be between 1900 and 2100";
            return null;
        }
    },

    url: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const ok = /^(https?:\/\/)?(www\.)?[\w\-]+(\.[\w\-]+)+(\/[\w\-._~:/?#[\]@!$&'()*+,;=%]*)?$/.test(v.trim());
            return ok ? null : "Please enter a valid URL (e.g. www.behance.net/yourname)";
        }
    },

    address: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            const trimmed = v.trim();
            if (trimmed.length < 5)   return "Address is too short — include street name and number";
            if (trimmed.length > 200) return "Address cannot exceed 200 characters";
            if (!/[a-zA-Z]/.test(trimmed) || !/\d/.test(trimmed))
                return "Address must include a street name and number (e.g. 12 Oak Street)";
            return null;
        }
    },

    skill: {
        validate: (v, required) => {
            if (!v || !v.trim()) return required ? "This field is required" : null;
            if (v.length > 60) return "Skill name cannot exceed 60 characters";
            return null;
        }
    },

    /* daterange — start + end dates with optional "Present" toggle.
       The value stored is an object: { start, end, present }
       Validation checks: start required, end required unless present is true,
       end must be after start unless present is true. */
    daterange: {
        validate: (v, required) => {
            if (!v || typeof v !== "object") return required ? "This field is required" : null;
            const { start, end, present } = v;
            if (!start || !start.trim()) return required ? "Start date is required" : null;
            /* Validate start date format */
            const patterns = [
                /^\d{2}\/\d{2}\/\d{4}$/,
                /^\d{2}-\d{2}-\d{4}$/,
                /^\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}$/
            ];
            if (!patterns.some(p => p.test(start.trim())))
                return "Start date: use DD/MM/YYYY or e.g. 01 Jan 2022";
            if (present) return null;
            if (!end || !end.trim()) return "End date is required, or toggle Present";
            if (!patterns.some(p => p.test(end.trim())))
                return "End date: use DD/MM/YYYY or e.g. 01 Mar 2025";
            /* Cross-field: end must be after start */
            const startDate = parseDisplayDate(start);
            const endDate   = parseDisplayDate(end);
            if (startDate && endDate && endDate <= startDate)
                return "End date must be after the start date";
            return null;
        }
    }
};

function validateField(field, value) {
    const key       = field.validate || field.type || "text";
    const validator = VALIDATORS[key];
    if (!validator) return null;
    return validator.validate(value, !field.optional);
}

function nativeDateToDisplay(nativeVal) {
    if (!nativeVal) return "";
    const [y, m, d] = nativeVal.split("-");
    return `${d}/${m}/${y}`;
}

/* ============================================================
   UNIVERSAL CROSS-FIELD VALIDATION
   Handles afterField rules for standard date fields.
   daterange fields handle their own internal cross-check
   inside the daterange validator above.
============================================================ */

function parseDisplayDate(str) {
    if (!str || !str.trim()) return null;
    const s = str.trim();

    const dmy = s.match(/^(\d{1,2})[\/\-](\d{2})[\/\-](\d{4})$/);
    if (dmy) return new Date(+dmy[3], +dmy[2] - 1, +dmy[1]);

    const months = {
        jan:0, feb:1, mar:2, apr:3, may:4,  jun:5,
        jul:6, aug:7, sep:8, oct:9, nov:10, dec:11
    };
    const named = s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})$/);
    if (named) {
        const m = months[named[2].toLowerCase().slice(0, 3)];
        if (m !== undefined) return new Date(+named[3], m, +named[1]);
    }
    return null;
}

function validateCrossFields(section, block) {
    const errors = [];
    section.fields.forEach(field => {
        if (!field.afterField) return;
        const thisVal  = block[field.name]      || "";
        const otherVal = block[field.afterField] || "";
        if (!thisVal.trim || !thisVal.trim() || !otherVal.trim()) return;
        const thisDate  = parseDisplayDate(thisVal);
        const otherDate = parseDisplayDate(otherVal);
        if (!thisDate || !otherDate) return;
        if (thisDate <= otherDate) {
            const otherField = section.fields.find(f => f.name === field.afterField);
            const otherLabel = otherField ? otherField.label : field.afterField;
            errors.push({ fieldName: field.name, error: `Must be after the ${otherLabel}` });
        }
    });
    return errors;
}

function getAllFieldErrors(template, documentData) {
    const errors = [];
    template.sections.forEach(section => {
        const blocks = Array.isArray(documentData[section.id])
            ? documentData[section.id]
            : [documentData[section.id]];
        blocks.forEach((block, idx) => {
            section.fields.forEach(field => {
                const err = validateField(field, block[field.name] !== undefined ? block[field.name] : "");
                if (err) errors.push({ sectionId: section.id, blockIndex: idx, fieldName: field.name });
            });
            validateCrossFields(section, block).forEach(({ fieldName }) => {
                errors.push({ sectionId: section.id, blockIndex: idx, fieldName });
            });
        });
    });
    return errors;
}

/* ============================================================
   HELPER — format a daterange value for display in the preview.
   Returns e.g. "01/03/2020 – Present" or "01/03/2020 – 15/06/2024"
============================================================ */

function formatDateRange(v) {
    if (!v || typeof v !== "object") return "";
    const { start, end, present } = v;
    if (!start) return "";
    if (present) return `${start} – Present`;
    if (end) return `${start} – ${end}`;
    return start;
}

/* ============================================================

const TEMPLATES = [

                ]

                ]

];

const FEATURED_IDS = ["resume", "invoice"];

/* ============================================================
   DOCUMENT INITIALIZATION
   daterange fields are initialised as objects, not strings.
============================================================ */

function initSection(section) {
    const obj = {};
    section.fields.forEach(f => {
        if (f.validate === "daterange") {
            obj[f.name] = { start: "", end: "", present: false };
        } else {
            obj[f.name] = "";
        }
    });
    return obj;
}

function initDocument(template) {
    const data = {};
    template.sections.forEach(section => {
        data[section.id] = section.repeatable
            ? [initSection(section)]
            : initSection(section);
    });
    return data;
}

/* ============================================================
   INVOICE CALCULATION HELPERS
============================================================ */

function parseNumber(val) {
    const n = parseFloat(String(val).replace(/[^0-9.]/g, ""));
    return isNaN(n) ? 0 : n;
}

function calcInvoiceTotals(items, taxRate) {
    const subtotal  = items.reduce((s, r) => s + parseNumber(r.qty) * parseNumber(r.price), 0);
    const taxAmount = subtotal * (parseNumber(taxRate) / 100);
    return { subtotal, taxAmount, total: subtotal + taxAmount };
}

function formatMoney(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

/* ============================================================
   IMAGE HELPERS
============================================================ */

function readImageAsBase64(file) {
    return new Promise((resolve, reject) => {
        const reader   = new FileReader();
        reader.onload  = e  => resolve(e.target.result);
        reader.onerror = () => reject(new Error("Could not read image"));
        reader.readAsDataURL(file);
    });
}

/* ============================================================
   PDF EXPORT — maximum quality html2canvas
   scale: 3  →  3× pixel density (sharpest practical value)
   JPEG quality: 1.0  →  maximum (no compression loss)
   windowWidth: fixed at 1400px so the preview renders at a
   consistent width regardless of the user's screen size,
   preventing layout shifts between exports.
============================================================ */

async function exportPreviewToPDF(previewDocRef, filename) {
    const node = previewDocRef.current;
    if (!node) return;

    /* Strip decorative styles so the PDF has clean white edges */
    const prevShadow = node.style.boxShadow;
    const prevMargin = node.style.margin;
    const prevRadius = node.style.borderRadius;
    node.style.boxShadow    = "none";
    node.style.margin       = "0";
    node.style.borderRadius = "0";

    /* Render at 3× scale — maximum practical sharpness */
    const canvas = await window.html2canvas(node, {
        scale:           3,
        useCORS:         true,
        allowTaint:      true,
        backgroundColor: "#ffffff",
        logging:         false,
        removeContainer: true,
        windowWidth:     1400
    });

    /* Restore decorative styles */
    node.style.boxShadow    = prevShadow;
    node.style.margin       = prevMargin;
    node.style.borderRadius = prevRadius;

    const A4_W     = 210;
    const A4_H     = 297;
    const canvasW  = canvas.width;
    const canvasH  = canvas.height;
    const pxPerMm  = canvasW / A4_W;
    const pageH_px = A4_H * pxPerMm;
    const pages    = Math.ceil(canvasH / pageH_px);
    const pdf      = new jsPDF("p", "mm", "a4");

    for (let p = 0; p < pages; p++) {
        if (p > 0) pdf.addPage();
        const sliceY      = p * pageH_px;
        const sliceH      = Math.min(pageH_px, canvasH - sliceY);
        const pageCanvas  = document.createElement("canvas");
        pageCanvas.width  = canvasW;
        pageCanvas.height = sliceH;
        const ctx         = pageCanvas.getContext("2d");
        ctx.drawImage(canvas, 0, sliceY, canvasW, sliceH, 0, 0, canvasW, sliceH);
        /* quality: 1.0 — maximum JPEG quality, no compression loss */
        const imgData     = pageCanvas.toDataURL("image/jpeg", 1.0);
        const sliceH_mm   = sliceH / pxPerMm;
        pdf.addImage(imgData, "JPEG", 0, 0, A4_W, sliceH_mm);
    }

    pdf.save(filename);
}

/* ============================================================
   SAVE / LOAD
============================================================ */

function saveProgressToFile(template, documentData, extrasState, uploadedImage) {
    const payload = {
        easydocVersion: "1.4",
        templateId:     template.id,
        documentData,
        extrasState,
        uploadedImage:  uploadedImage || null
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = "easydoc-" + template.id + "-progress.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function loadProgressFromFile() {
    return new Promise((resolve, reject) => {
        const input    = document.createElement("input");
        input.type     = "file";
        input.accept   = ".json,application/json";
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) { reject(new Error("No file selected")); return; }
            const reader   = new FileReader();
            reader.onload  = evt => {
                try { resolve(JSON.parse(evt.target.result)); }
                catch { reject(new Error("Invalid file — could not read the saved progress.")); }
            };
            reader.onerror = () => reject(new Error("Could not read file."));
            reader.readAsText(file);
        };
        document.body.appendChild(input);
        input.click();
        document.body.removeChild(input);
    });
}

function ImageUploadZone({ imageConfig, uploadedImage, onImageChange }) {
    const fileInputRef = useRef(null);
    if (!imageConfig) return null;

    const isCircle = imageConfig.shape === "circle";

    async function handleFileChange(e) {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        try {
            const base64 = await readImageAsBase64(file);
            onImageChange(base64);
        } catch { /* silently ignore */ }
        e.target.value = "";
    }

    function handleRemove(e) {
        e.stopPropagation();
        onImageChange(null);
    }

    return (
        <div className="image-upload-section">
            <div className="image-upload-label">{imageConfig.label}</div>
            <div className="image-upload-zone">
                <div
                    className={isCircle ? "image-upload-trigger" : "image-upload-trigger square"}
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}

/* ============================================================
   DATE RANGE FIELD COMPONENT
   Renders: [Start Date 📅] — [End Date 📅] [Present]
   Value is an object: { start: string, end: string, present: bool }
   When Present is active, the end date input is hidden.
   Cross-field check (end > start) is inside the daterange validator.
============================================================ */

function DateRangeField({ field, value, onChange, forceShowError }) {
    const [touched, setTouched] = useState(false);

    /* value may be a string if loaded from older save — normalise */
    const safeValue = (value && typeof value === "object")
        ? value
        : { start: "", end: "", present: false };

    const { start, end, present } = safeValue;

    const shouldShowError = touched || forceShowError;
    const errorMsg        = shouldShowError ? validateField(field, safeValue) : null;
    const isValid         = shouldShowError && !errorMsg && start.length > 0;

    const startClass = [
        "field-input",
        isValid  ? "is-valid"   : "",
        errorMsg ? "is-invalid" : ""
    ].filter(Boolean).join(" ");

    const endClass = [
        "field-input",
        isValid  ? "is-valid"   : "",
        (errorMsg && !present) ? "is-invalid" : ""
    ].filter(Boolean).join(" ");

    function updateStart(v) {
        onChange({ ...safeValue, start: v });
    }

    function updateEnd(v) {
        onChange({ ...safeValue, end: v });
    }

    function togglePresent() {
        onChange({ ...safeValue, present: !present, end: present ? end : "" });
        setTouched(true);
    }

    function handleBlur() { setTouched(true); }

    return (
        <div className="daterange-wrapper" data-field-name={field.name}>
            <div className="daterange-row">
                <DatePicker
                    value={start}
                    onChange={updateStart}
                    onBlur={handleBlur}
                    placeholder="Start date"
                    inputClass={startClass}
                    fieldName={field.name + "_start"}
                />
                <span className="daterange-separator">–</span>
                {present ? (
                    <button
                        type="button"
                        className="btn-present is-active"
                        onClick={togglePresent}
                        title="Click to set an end date"
                    >
                        Present
                    </button>
                ) : (
                    <>
                        <DatePicker
                            value={end}
                            onChange={updateEnd}
                            onBlur={handleBlur}
                            placeholder="End date"
                            inputClass={endClass}
                            fieldName={field.name + "_end"}
                        />
                        <button
                            type="button"
                            className="btn-present"
                            onClick={togglePresent}
                            title="Currently working here"
                        >
                            Present
                        </button>
                    </>
                )}
            </div>
            {errorMsg && (
                <div className="field-error">
                    <span className="error-icon">⚠</span>{errorMsg}
                </div>
            )}
        </div>
    );
}

/* ============================================================
   UNIVERSAL SMART FIELD COMPONENT
   Dispatches to the correct input type automatically.
   daterange → DateRangeField (two pickers + Present toggle)
   date      → DatePicker (single calendar picker)
   textarea  → resizable textarea with character counter
   number    → digits-only input
   all other → standard text input
============================================================ */

function SmartField({ field, value, onChange, forceShowError, crossFieldError }) {
    const [touched,     setTouched] = useState(false);

    const shouldShowError = touched || forceShowError;
    const isDateField     = field.validate === "date";
    const isDateRange     = field.validate === "daterange";
    const isNumberField   = field.validate === "number";
    const isTextarea      = field.type === "textarea";
    const showCounter     = isTextarea
        || field.validate === "textarea"
        || field.validate === "text";

    /* daterange has its own component with internal state */
    if (isDateRange) {
        return (
            <DateRangeField
                field={field}
                value={value}
                onChange={onChange}
                forceShowError={forceShowError}
            />
        );
    }

    const fieldError = shouldShowError ? validateField(field, value) : null;
    const errorMsg   = fieldError || (shouldShowError ? (crossFieldError || null) : null);
    const isValid    = shouldShowError && !fieldError && !crossFieldError && value.length > 0;

    const charCount    = (value || "").length;
    const counterClass = charCount > MAX_TEXT
        ? "field-counter counter-over"
        : charCount > MAX_TEXT * 0.85
        ? "field-counter counter-warn"
        : "field-counter";

    const inputClass = [
        "field-input",
        isValid  ? "is-valid"   : "",
        errorMsg ? "is-invalid" : ""
    ].filter(Boolean).join(" ");

    function handleChange(e) {
        let val = e.target.value;
        if (isNumberField) {
            val = val.replace(/[^0-9.]/g, "");
            const parts = val.split(".");
            if (parts.length > 2) val = parts[0] + "." + parts.slice(1).join("");
        }
        onChange(val);
    }

    function handleBlur() { setTouched(true); }

    const dateWrapClass = isDateField
        ? ["date-field-wrapper",
           isValid  ? "date-valid"   : "",
           errorMsg ? "date-invalid" : ""]
            .filter(Boolean).join(" ")
        : null;

    /* ── TEXTAREA ── */
    if (isTextarea) {
        return (
            <div>
                <textarea
                    className={inputClass}
                    rows="3"
                    placeholder={field.placeholder || ""}
                    value={value || ""}
                    onChange={handleChange}
                    onBlur={handleBlur}
                    maxLength={MAX_TEXT + 1}
                    data-field-name={field.name}
                />
                {showCounter && (
                    <div className={counterClass}>
                        {charCount.toLocaleString()} / {MAX_TEXT.toLocaleString()}
                    </div>
                )}
                {errorMsg && (
                    <div className="field-error">
                        <span className="error-icon">⚠</span>{errorMsg}
                    </div>
                )}
            </div>
        );
    }

    /* ── SINGLE DATE — universal calendar picker ── */
    if (isDateField) {
        return (
            <div>
                <div className={dateWrapClass}>
                    <DatePicker
                        value={value || ""}
                        onChange={v => { onChange(v); }}
                        onBlur={handleBlur}
                        placeholder={field.placeholder || "DD/MM/YYYY"}
                        inputClass={inputClass}
                        fieldName={field.name}
                    />
                </div>
                {errorMsg && (
                    <div className="field-error">
                        <span className="error-icon">⚠</span>{errorMsg}
                    </div>
                )}
            </div>
        );
    }

    /* ── ALL OTHER FIELD TYPES ── */
    return (
        <div>
            <input
                className={inputClass}
                type="text"
                placeholder={field.placeholder || ""}
                value={value || ""}
                onChange={handleChange}
                onBlur={handleBlur}
                inputMode={isNumberField ? "decimal" : "text"}
                data-field-name={field.name}
            />
            {showCounter && (
                <div className={counterClass}>
                    {charCount.toLocaleString()} / {MAX_TEXT.toLocaleString()}
                </div>
            )}
            {errorMsg && (
                <div className="field-error">
                    <span className="error-icon">⚠</span>{errorMsg}
                </div>
            )}
        </div>
    );
}

                    </thead>
                    <tbody>
                        {items.map((row, i) => {
                            const qty   = parseNumber(row.qty);
                            const price = parseNumber(row.price);
                            const line  = qty * price;
                            return (
                                <tr key={i}>
                                    <td>{row.item || ""}</td>
                                    <td className="qty-cell">{row.qty || ""}</td>
                                    <td className="price-cell">
                                        {row.price ? formatMoney(parseNumber(row.price)) : ""}
                                    </td>
                                    <td style={{ textAlign: "right", fontFamily: "'DM Mono', monospace" }}>
                                        {line > 0 ? formatMoney(line) : ""}
                                    </td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            )}

            {subtotal > 0 && (
                <div className="invoice-totals">
                    <div className="total-row">
                        <span>Subtotal</span>
                        <span className="total-value">{formatMoney(subtotal)}</span>
                    </div>
                    {taxRateNum > 0 && (
                        <div className="total-row">
                            <span>Tax ({taxRateNum}%)</span>
                            <span className="total-value">{formatMoney(taxAmount)}</span>
                        </div>
                    )}
                    <div className="total-row">
                        <span>Total Due</span>
                        <span className="total-value">{formatMoney(total)}</span>
                    </div>
                </div>
            )}

            <div className="invoice-notes">Thank you for your business.</div>

        </div>
    );
}

/* ============================================================
   PREVIEW REGISTRY
============================================================ */

const PREVIEW_REGISTRY = {
    resume:  ResumePreview,
    invoice: InvoicePreview
};

function Preview({ template, data, extrasState, uploadedImage, previewDocRef }) {
    if (!template) return null;
    const Component = PREVIEW_REGISTRY[template.id];
    if (!Component) return null;
    return (
        <Component
            data={data}
            extrasState={extrasState}
            uploadedImage={uploadedImage}
            previewDocRef={previewDocRef}
        />
    );
}

/* ============================================================
   UNIVERSAL FORM RENDERER
============================================================ */

function UniversalForm({ template, documentData, updateField, addBlock, removeBlock, forceShowErrors }) {
    return (
        <>
            {template.sections.map(section => {
                const blocks = Array.isArray(documentData[section.id])
                    ? documentData[section.id]
                    : [documentData[section.id]];

                return (
                    <div key={section.id} className="section-block">

                        <div className="section-label">{section.title}</div>

                        {blocks.map((block, idx) => {
                            const crossErrors = {};
                            validateCrossFields(section, block).forEach(({ fieldName, error }) => {
                                crossErrors[fieldName] = error;
                            });

                            return (
                                <div
                                    key={idx}
                                    className={section.repeatable ? "repeatable-block" : ""}
                                >
                                    {section.repeatable && (
                                        <div className="repeatable-block-header">
                                            <span className="repeatable-block-index">
                                                #{String(idx + 1).padStart(2, "0")}
                                            </span>
                                            {blocks.length > 1 && (
                                                <button
                                                    className="btn-remove"
                                                    onClick={() => removeBlock(section, idx)}
                                                >
                                                    ✕ Remove
                                                </button>
                                            )}
                                        </div>
                                    )}

                                    {section.fields.map(field => (
                                        <div key={field.name} className="field-group">
                                            <label className="field-label">
                                                {field.label}
                                                {field.optional && (
                                                    <span className="optional-badge">optional</span>
                                                )}
                                            </label>
                                            <SmartField
                                                field={field}
                                                value={block[field.name]}
                                                forceShowError={forceShowErrors}
                                                crossFieldError={crossErrors[field.name] || null}
                                                onChange={val =>
                                                    updateField(section.id, idx, field.name, val)
                                                }
                                            />
                                        </div>
                                    ))}
                                </div>
                            );
                        })}

                        {section.repeatable && (
                            <button
                                className="btn-add"
                                onClick={() => addBlock(section)}
                            >
                                + Add {section.title}
                            </button>
                        )}
                    </div>
                );
            })}
        </>
    );
}

/* ============================================================
   MAIN APP COMPONENT
============================================================ */

function App() {
    const [stage,           setStage]           = useState("home");
    const [template,        setTemplate]        = useState(null);
    const [documentData,    setDocumentData]    = useState({});
    const [extrasState,     setExtrasState]     = useState({});
    const [search,          setSearch]          = useState("");
    const [forceShowErrors, setForceShowErrors] = useState(false);
    const [loadError,       setLoadError]       = useState("");
    const [uploadedImage,   setUploadedImage]   = useState(null);
    const [exporting,       setExporting]       = useState(false);

    const formPanelBodyRef = useRef(null);
    const previewDocRef    = useRef(null);

    function selectTemplate(tpl) {
        setTemplate(tpl);
        setDocumentData(initDocument(tpl));
        setForceShowErrors(false);
        setLoadError("");
        setUploadedImage(null);
        setExtrasState(prev => ({ ...prev, [tpl.id]: {} }));
        setStage("edit");
    }

    function updateField(sectionId, index, fieldName, value) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (Array.isArray(copy[sectionId])) {
                copy[sectionId][index][fieldName] = value;
            } else {
                copy[sectionId][fieldName] = value;
            }
            return copy;
        });
    }

    function addBlock(section) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            copy[section.id].push(initSection(section));
            return copy;
        });
    }

    function removeBlock(section, index) {
        setDocumentData(prev => {
            const copy = structuredClone(prev);
            if (copy[section.id].length > 1) copy[section.id].splice(index, 1);
            return copy;
        });
    }

    async function handleExportPDF() {
        const errors = getAllFieldErrors(template, documentData);
        if (errors.length > 0) {
            setForceShowErrors(true);
            requestAnimationFrame(() => {
                const panel = formPanelBodyRef.current;
                if (!panel) return;
                const firstInvalid = panel.querySelector(".is-invalid");
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
                    firstInvalid.focus({ preventScroll: true });
                }
            });
            return;
        }
        setExporting(true);
        try {
            await exportPreviewToPDF(previewDocRef, template.id + ".pdf");
        } finally {
            setExporting(false);
        }
    }

    function handleSave() {
        saveProgressToFile(template, documentData, extrasState, uploadedImage);
    }

    async function handleLoad() {
        setLoadError("");
        try {
            const payload = await loadProgressFromFile();
            if (!payload.templateId || !payload.documentData) {
                setLoadError("This file doesn't look like an EasyDoc save file.");
                return;
            }
            const tpl = TEMPLATES.find(t => t.id === payload.templateId);
            if (!tpl) {
                setLoadError("The template in this save file is not available.");
                return;
            }
            setTemplate(tpl);
            setDocumentData(payload.documentData);
            setExtrasState(payload.extrasState || {});
            setUploadedImage(payload.uploadedImage || null);
            setForceShowErrors(false);
            setLoadError("");
            setStage("edit");
        } catch (err) {
            setLoadError(err.message || "Could not load the file.");
        }
    }

    const featuredTemplates = TEMPLATES.filter(tpl => FEATURED_IDS.includes(tpl.id));
    const filteredTemplates = TEMPLATES.filter(tpl =>
        tpl.name.toLowerCase().includes(search.toLowerCase()) ||
        tpl.description.toLowerCase().includes(search.toLowerCase()) ||
        tpl.category.toLowerCase().includes(search.toLowerCase())
    );

    const ExtrasComponent = template ? (EXTRAS_REGISTRY[template.id] || null) : null;

    return (
        <div style={{ minHeight: "100vh" }}>

            {exporting && (
                <div className="pdf-overlay">
                    <div className="pdf-overlay-card">
                        <div className="pdf-overlay-spinner"></div>
                        <div className="pdf-overlay-title">Generating PDF…</div>
                        <div className="pdf-overlay-sub">This takes just a moment</div>
                    </div>
                </div>
            )}

            <header className="app-header">
                <div className="header-inner">
                    <div className="app-logo">
                        <div className="logo-mark">E</div>
                        <span className="logo-text">EasyDoc</span>
                    </div>
                    {stage === "edit" && (
                        <button className="btn-back" onClick={() => setStage("home")}>
                            ← Back
                        </button>
                    )}
                </div>
            </header>

            {stage === "home" && (
                <div className="home-wrapper">

                    <div className="home-heading">
                        <h2>What would you like to create?</h2>
                        <p>Choose a template and build a professional document in minutes</p>
                    </div>

                    <div className="home-section-heading">
                        <h3>⭐ Featured</h3>
                        <div className="section-rule"></div>
                    </div>

                    <div className="template-grid" style={{ marginBottom: "0" }}>
                        {featuredTemplates.map((tpl, i) => (
                            <button
                                key={tpl.id}
                                className="template-card animate-in"
                                style={{ animationDelay: (i * 70) + "ms" }}
                                onClick={() => selectTemplate(tpl)}
                            >
                                <span className="card-icon">{tpl.icon}</span>
                                <div className="card-category">{tpl.category}</div>
                                <div className="card-name">{tpl.name}</div>
                                <div className="card-desc">{tpl.description}</div>
                            </button>
                        ))}
                    </div>

                    <hr className="home-divider" />

                    <div className="search-bar-wrapper">
                        <span className="search-icon">🔍</span>
                        <input
                            className="search-bar-input"
                            type="text"
                            placeholder="Search all templates..."
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                        />
                    </div>

                    <div className="all-docs-header">
                        <div className="home-section-heading" style={{ marginBottom: "0" }}>
                            <h3>All Documents</h3>
                            <div className="section-rule"></div>
                        </div>
                        <span className="all-docs-count">
                            {filteredTemplates.length} template{filteredTemplates.length !== 1 ? "s" : ""}
                        </span>
                    </div>

                    {filteredTemplates.length > 0 ? (
                        <div className="template-grid">
                            {filteredTemplates.map((tpl, i) => (
                                <button
                                    key={tpl.id}
                                    className="template-card animate-in"
                                    style={{ animationDelay: (i * 70) + "ms" }}
                                    onClick={() => selectTemplate(tpl)}
                                >
                                    <span className="card-icon">{tpl.icon}</span>
                                    <div className="card-category">{tpl.category}</div>
                                    <div className="card-name">{tpl.name}</div>
                                    <div className="card-desc">{tpl.description}</div>
                                </button>
                            ))}
                        </div>
                    ) : (
                        <div className="no-results">
                            <span className="no-results-icon">🔍</span>
                            <p>No templates found for "<strong>{search}</strong>"</p>
                        </div>
                    )}

                </div>
            )}

            {stage === "edit" && template && (
                <div className="editor-wrapper">
                    <div className="editor-grid">

                        <div className="form-panel animate-in">

                            <div className="form-panel-header">
                                <span className="panel-icon">{template.icon}</span>
                                <h2 className="panel-title">{template.name}</h2>
                            </div>

                            <div className="form-panel-body" ref={formPanelBodyRef}>

                                <ImageUploadZone
                                    imageConfig={template.image}
                                    uploadedImage={uploadedImage}
                                    onImageChange={setUploadedImage}
                                />

                                <UniversalForm
                                    template={template}
                                    documentData={documentData}
                                    updateField={updateField}
                                    addBlock={addBlock}
                                    removeBlock={removeBlock}
                                    forceShowErrors={forceShowErrors}
                                />

                                {ExtrasComponent && (
                                    <ExtrasComponent
                                        extrasState={extrasState}
                                        setExtrasState={setExtrasState}
                                    />
                                )}

                            </div>

                            <div className="form-panel-footer">

                                <div className="footer-saveload-row">
                                    <button
                                        className="btn-secondary"
                                        onClick={handleSave}
                                        title="Download a save file of your current progress"
                                    >
                                        💾 Save Progress
                                    </button>
                                    <button
                                        className="btn-secondary"
                                        onClick={handleLoad}
                                        title="Load a previously saved progress file"
                                    >
                                        📂 Load Progress
                                    </button>
                                </div>

                                {loadError && (
                                    <div className="field-error">
                                        <span className="error-icon">⚠</span>
                                        {loadError}
                                    </div>
                                )}

                                <button
                                    className="btn-download"
                                    onClick={handleExportPDF}
                                    disabled={exporting}
                                >
                                    {exporting ? "Generating…" : "↓ Download PDF"}
                                </button>

                            </div>

                        </div>

                        <div className="preview-panel animate-in" style={{ animationDelay: "80ms" }}>

                            <div className="preview-panel-header">
                                <span className="preview-label">Live Preview</span>
                                <span className="preview-live-dot">Live</span>
                            </div>

                            <div className="preview-scroll-area">
                                <Preview
                                    template={template}
                                    data={documentData}
                                    extrasState={extrasState}
                                    uploadedImage={uploadedImage}
                                    previewDocRef={previewDocRef}
                                />
                            </div>

                        </div>

                    </div>
                </div>
            )}

        </div>
    );
}

/* ============================================================
   MOUNT
============================================================ */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
